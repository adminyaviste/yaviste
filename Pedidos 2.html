<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ya Viste — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1A1A1A;
    --paper:#F7F5EF;
    --paper-2:#FFFFFF;
    --line:#E3DFD3;
    --cyan:#00AEEF;
    --magenta:#E6007E;
    --yellow:#FFC400;
    --teal:#0B4F6C;
    --teal-dark:#083A50;
    --muted:#78736A;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Archivo Black',sans-serif;}

  header.app{
    background:var(--teal-dark);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.app .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.app .eye{
    width:30px;height:30px;border-radius:50%;
    background:conic-gradient(var(--cyan),var(--magenta),var(--yellow),var(--cyan));
    flex-shrink:0;
    position:relative;
  }
  header.app .eye::after{
    content:"";
    position:absolute;inset:9px;
    background:var(--teal-dark);
    border-radius:50%;
  }
  header.app h1{
    font-size:17px;
    margin:0;
    letter-spacing:0.3px;
  }
  header.app .sub{
    font-size:11px;
    color:#B7CBD3;
    margin-top:1px;
  }
  .btn{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--magenta);color:#fff;}
  .btn-secondary{background:#fff;color:var(--teal-dark);border:1.5px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--teal-dark);padding:8px 10px;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-wa{background:#25D366;color:#fff;}
  .btn-cotizacion{background:var(--yellow);color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  main{
    max-width:980px;
    margin:0 auto;
    padding:20px 16px 80px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .filters{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    flex:1 1 100%;
  }
  .search-cliente{max-width:280px;}
  .chip{
    border:1.5px solid var(--line);
    background:var(--paper-2);
    padding:6px 12px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
  }
  .chip.active{
    border-color:var(--teal);
    color:var(--teal-dark);
    background:#E8F1F4;
  }
  .entrega-timer{margin-top:8px;font-size:12.5px;font-weight:700;color:#1E8E3E;font-variant-numeric:tabular-nums;}
  .entrega-timer.pronto{color:#C79100;}
  .entrega-timer.critico,.entrega-timer.vencido{color:#C62828;}
  .chip[data-f="debe"]{margin-left:auto;}
  .chip[data-f="pendiente"],.chip[data-f="proceso"],.chip[data-f="pago_en_proceso"]{border-color:#E0A800;color:#8A6500;background:#FFF6D1;}
  .chip[data-f="pendiente"].active,.chip[data-f="proceso"].active,.chip[data-f="pago_en_proceso"].active{background:#F5C518;border-color:#E0A800;color:#3B2F00;}
  .chip[data-f="terminado"],.chip[data-f="pagado"]{border-color:#1E8E3E;color:#1E8E3E;background:#E6F4EA;}
  .chip[data-f="terminado"].active,.chip[data-f="pagado"].active{background:#1E8E3E;border-color:#1E8E3E;color:#fff;}
  .chip[data-f="urgente"],.chip[data-f="debe"]{border-color:#C62828;color:#C62828;background:#FDECEC;}
  .chip[data-f="urgente"].active,.chip[data-f="debe"].active{background:#C62828;border-color:#C62828;color:#fff;}

  .summary-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .summary-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .summary-card .num{font-family:'Archivo Black';font-size:20px;}
  .summary-card .label{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .summary-delivery-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:104px;overflow-y:auto;}
  .summary-delivery-order{padding:0;border:0;background:none;color:var(--teal-dark);font:500 11px 'Inter',sans-serif;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .summary-delivery-order:hover{text-decoration:underline;}
  .summary-delivery-empty{margin-top:8px;color:var(--muted);font-size:11px;}

  .order-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .folio{
    font-family:'Archivo Black';
    font-size:23px;
    color:var(--teal-dark);
    line-height:1.15;
  }
  .cliente-nombre{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:5px;}
  .order-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .order-details{
    margin-top:8px;
    border-radius:8px;
    padding:8px 10px;
    background:#E8F5F3;
    color:var(--teal-dark);
  }
  .order-detail{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    font-size:13px;
    font-weight:600;
  }
  .order-detail+.order-detail{margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,105,100,.14);}
  .order-detail-name{overflow-wrap:anywhere;}
  .order-detail-quantity{flex:none;font-size:12px;white-space:nowrap;}
  .order-notes{
    margin-top:7px;
    padding:8px 10px;
    border-left:3px solid #D89A18;
    border-radius:6px;
    background:#FFF6DF;
    color:#674B13;
    font-size:12px;
    line-height:1.45;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .order-notes-label{display:block;margin-bottom:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .pill{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
  }
  .pill.pendiente{background:#FCE4F1;color:var(--magenta);}
  .pill.proceso{background:#DFF3FC;color:#0287BD;}
  .pill.terminado{background:#DEF4E8;color:#1E7A46;}
  .pill.pago-pendiente{background:#FFF2CC;color:#785B00;}
  #btnExportar{background:#1E8E3E;border-color:#1E8E3E;color:#fff;}
  #btnExportar:hover{background:#17712F;border-color:#17712F;}
  .pill.urgente{background:#FDE0E0;color:#B3261E;}
  .pill.pago-en-proceso{background:#DDEFFB;color:#0B4F6C;}
  .pill.pagado{background:#DEF4E8;color:#1E7A46;}
  .order-statuses{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .order-money{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:13px;
  }
  .order-money .saldo-pos{color:var(--danger);font-weight:700;}
  .order-money .saldo-ok{color:#1E7A46;font-weight:700;}
  .employee-balance{
    margin-top:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--muted);
    font-size:13px;
  }
  .employee-balance strong{color:var(--danger);}
  .order-edit-hint{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    margin-top:6px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty .eye-big{
    width:52px;height:52px;border-radius:50%;
    background:conic-gradient(var(--cyan),var(--magenta),var(--yellow),var(--cyan));
    margin:0 auto 14px;
    position:relative;
  }
  .empty .eye-big::after{content:"";position:absolute;inset:16px;background:var(--paper);border-radius:50%;}

  /* Overlay / drawer */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,20,20,0.45);
    z-index:40;
    display:none;
  }
  .overlay.show{display:block;}
  .drawer{
    position:fixed;
    top:0;right:0;bottom:0;
    width:min(480px,100%);
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform .25s ease;
    overflow-y:auto;
    box-shadow:-8px 0 24px rgba(0,0,0,0.15);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    position:sticky;top:0;
    background:var(--teal-dark);
    color:#fff;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:2;
  }
  .drawer-head h2{margin:0;font-size:16px;}
  .drawer-body{padding:18px;}

  label{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    display:block;
    margin-bottom:5px;
    margin-top:14px;
  }
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%;
    padding:10px 11px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .section-title{
    font-family:'Archivo Black';
    font-size:13px;
    letter-spacing:0.2px;
    margin-top:22px;
    margin-bottom:8px;
    color:var(--teal-dark);
  }
  .billing-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    color:var(--teal-dark);
    font-family:'Archivo Black',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .billing-toggle input{width:auto;margin:0;flex-shrink:0;}

  .prod-row{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
  }
  .prod-row .row2{grid-template-columns:1fr 1fr 1fr;}
  .prod-row .desc-line{margin-bottom:8px;}
  .prod-remove{
    background:none;border:none;color:var(--danger);
    font-size:12px;font-weight:600;cursor:pointer;
    margin-top:6px;padding:0;
  }
  .add-prod{
    width:100%;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--teal-dark);
    padding:10px;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  .totales{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-top:10px;
  }
  .totales .linea{
    display:flex;justify-content:space-between;
    font-size:13.5px;margin-bottom:6px;
  }
  .totales .linea.total{
    font-family:'Archivo Black';
    font-size:16px;
    border-top:1px dashed var(--line);
    padding-top:8px;margin-top:4px;
  }
  .checkbox-line{
    display:flex;align-items:center;gap:8px;
    margin-top:14px;font-size:13.5px;font-weight:500;color:var(--ink);
  }
  .checkbox-line input{width:auto;}

  .drawer-actions{
    display:flex;gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .drawer-actions .btn{flex:1;justify-content:center;}

  .status-actions{
    display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;
  }
  .status-actions .chip{flex:1;text-align:center;}

  /* Hidden printable note */
  #nota-render{
    position:fixed;
    left:-9999px;top:0;
    width:600px;
    background:#fff;
    font-family:'Inter',sans-serif;
    color:#1A1A1A;
    padding:0;
  }
  .nota-inner{padding:28px;}
  .nota-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid #1A1A1A;
    padding-bottom:14px;margin-bottom:16px;
  }
  .nota-brand{font-family:'Archivo Black';font-size:22px;}
  .nota-brand .sub{font-family:'Inter';font-size:10.5px;font-weight:600;color:#78736A;letter-spacing:0.5px;}
  .nota-folio-box{
    text-align:right;
  }
  .nota-folio-box .f{font-family:'Archivo Black';font-size:18px;color:#E6007E;}
  .nota-folio-box .d{font-size:11px;color:#78736A;}
  .nota-cliente{font-size:12.5px;line-height:1.7;margin-bottom:16px;}
  .nota-cliente b{display:inline-block;width:88px;color:#78736A;font-weight:600;}
  table.nota-tabla{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
  table.nota-tabla th{
    text-align:left;background:#1A1A1A;color:#fff;padding:7px 8px;font-size:10.5px;
  }
  table.nota-tabla td{padding:7px 8px;border-bottom:1px solid #E3DFD3;}
  table.nota-tabla td.num,table.nota-tabla th.num{text-align:right;}
  .nota-totales{margin-left:auto;width:230px;font-size:12.5px;}
  .nota-totales .l{display:flex;justify-content:space-between;padding:3px 0;}
  .nota-totales .l.total{font-family:'Archivo Black';font-size:15px;border-top:2px solid #1A1A1A;margin-top:4px;padding-top:6px;}
  .nota-totales .l.saldo{color:#E6007E;font-weight:700;}
  .nota-foot{
    margin-top:18px;padding-top:12px;border-top:1px dashed #E3DFD3;
    font-size:11px;color:#78736A;display:flex;justify-content:space-between;
  }
  .nota-redes{
    display:flex;justify-content:center;align-items:center;gap:18px;
    margin-top:12px;padding-top:10px;border-top:1px solid #E3DFD3;
    color:#1A1A1A;font-size:10.5px;
  }
  .nota-horario{margin-top:10px;text-align:center;font-size:10.5px;font-weight:600;color:#4D4A44;line-height:1.4;}
  .nota-redes-item{display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .nota-redes-icon{display:block;width:18px;height:18px;flex-shrink:0;object-fit:contain;}
  .nota-redes-icon-instagram{width:32px;}
  .nota-redes{flex-wrap:wrap;row-gap:8px;}
  .nota-redes-tels{display:flex;flex-direction:column;line-height:1.35;}
  .nota-consulta{margin-top:10px;text-align:center;font-size:10.5px;color:#78736A;line-height:1.4;}
  .nota-link{color:#E6007E;text-decoration:underline;}

  /* Portal de acceso */
  .portal{
    min-height:100vh;
    background:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .portal-box{width:100%;max-width:340px;}
  .portal-btn{width:100%;justify-content:center;margin-bottom:10px;padding:13px;}
  .portal-note{
    color:#8CA9B3;font-size:11px;text-align:center;
    margin-top:16px;line-height:1.5;
  }

  /* Consulta pública */
  .consulta{
    min-height:100vh;
    background:var(--paper);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;
  }
  .consulta-box{
    width:100%;max-width:380px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
  }
  .estado-cliente{
    margin-top:18px;
    padding:16px;
    border-radius:10px;
    background:#F3F7F8;
    border:1px solid var(--line);
  }
  .estado-cliente .pill{font-size:12.5px;padding:6px 14px;}
  .estado-cliente .fila{
    display:flex;justify-content:space-between;
    font-size:13px;margin-top:10px;
  }
  .barra-pasos{
    display:flex;gap:4px;margin-top:14px;
  }
  .barra-pasos .paso{
    flex:1;height:6px;border-radius:100px;background:var(--line);
  }
  .barra-pasos .paso.on{background:var(--teal);}

  /* Modal propio (reemplaza prompt/alert/confirm nativos, bloqueados en el sandbox) */
  .modal-box{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:var(--paper-2);
    border-radius:12px;
    padding:20px;
    width:min(340px,90%);
    z-index:90;
    display:none;
    box-shadow:0 12px 32px rgba(0,0,0,0.25);
  }
  .modal-box.show{display:block;}
  .modal-msg{font-size:14px;line-height:1.5;color:var(--ink);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{flex:1;justify-content:center;}
  #modalOverlay.show{display:block;z-index:85;}
</style>
</head>
<body>

<!-- PORTAL DE ACCESO -->
<div id="portal" class="portal">
  <div class="portal-box">
    <div class="eye" style="width:44px;height:44px;margin:0 auto 14px;"></div>
    <h1 class="display" style="text-align:center;font-size:20px;color:#fff;margin:0 0 4px;">YA VISTE</h1>
    <div style="text-align:center;color:#B7CBD3;font-size:12px;margin-bottom:22px;">¿Cómo quieres entrar?</div>
    <button class="btn btn-primary portal-btn" id="btnRolAdmin">Soy administrador</button>
    <button class="btn btn-teal portal-btn" id="btnRolEmpleado">Soy empleado</button>
    <div style="text-align:center;margin-top:14px;"><a href="index.html" style="color:#8CA9B3;font-size:12px;">← Volver al sitio</a></div>
  </div>
</div>

<!-- CONSULTA PÚBLICA DEL CLIENTE -->
<div id="consulta" class="consulta" style="display:none;">
  <div class="consulta-box">
    <button class="btn btn-ghost" id="btnVolverPortal" style="color:var(--teal-dark);padding:0;margin-bottom:14px;">← Volver</button>
    <h2 class="display" style="font-size:17px;margin:0 0 4px;">Consultar mi pedido</h2>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px;">Ingresa el folio de tu pedido para ver su estatus.</div>
    <label for="c_folio">Número de folio</label>
    <input id="c_folio" type="text" inputmode="numeric" autocomplete="off" placeholder="#0001">
    <button class="btn btn-primary" id="btnConsultar" style="width:100%;margin-top:16px;">Consultar estatus</button>
    <div id="consultaResultado"></div>
  </div>
</div>

<!-- DASHBOARD (admin / empleado) -->
<div id="appRoot" style="display:none;">
<header class="app">
  <div class="brand">
    <div class="eye"></div>
    <div>
      <h1 class="display">YA VISTE</h1>
      <div class="sub" id="rolTag">Pedidos · Chiautempan, Tlaxcala</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-primary" id="btnNuevo">+ Nuevo pedido</button>
    <button class="btn btn-cotizacion" id="btnNuevaCotizacion">Generar cotización</button>
    <button class="btn btn-secondary" id="btnExportar">Exportar a Excel</button>
    <button class="btn btn-ghost" id="btnSalir" style="color:#fff;">Cerrar sesión</button>
    <a href="index.html" class="btn btn-ghost" style="color:#fff;">← Sitio</a>
  </div>
</header>

<main>
  <div class="summary-row" id="resumen"></div>

  <div class="toolbar">
    <input id="buscarCliente" type="search" class="search-cliente" placeholder="Buscar por nombre o folio" autocomplete="off">
    <div class="filters" id="filtros">
      <button class="chip active" data-f="todos">Todos</button>
      <button class="chip" data-f="pendiente">En diseño</button>
      <button class="chip" data-f="proceso">En proceso</button>
      <button class="chip" data-f="urgente">Urgente</button>

let state = { orders: [] };

let currentRole = null; // 'admin' | 'empleado'
const SUPABASE_CONFIG = window.YAVISTE_SUPABASE_CONFIG || {};
const supabaseClient = window.supabase && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey
  && !SUPABASE_CONFIG.url.includes('YOUR_PROJECT_REF')
  && !SUPABASE_CONFIG.anonKey.includes('YOUR_SUPABASE_')
  ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
    auth:{persistSession:true, autoRefreshToken:true}
  })
  : null;
const LEGACY_STORAGE_KEY = 'yaviste-orders-v1';
const ETIQUETAS_PAGO = {pendiente:'Pendiente', en_proceso:'Pago en proceso', pagado:'Pagado'};

// ---------- Modal propio (prompt/alert/confirm nativos no funcionan en este sandbox) ----------
function abrirModal({mensaje, conInput=false, tipoInput='text', soloOk=false}){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    const box = document.getElementById('modalBox');
    const input = document.getElementById('modalInput');
    document.getElementById('modalMsg').textContent = mensaje;
    input.style.display = conInput ? 'block' : 'none';
    input.type = tipoInput;
    input.value = '';
    document.getElementById('modalCancel').style.display = soloOk ? 'none' : 'inline-flex';

    overlay.classList.add('show');
    box.classList.add('show');
    if(conInput) setTimeout(()=>input.focus(), 50);

    function cerrar(resultado){
      overlay.classList.remove('show');
      box.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKey);
      resolve(resultado);
    }
    const okBtn = document.getElementById('modalOk');
    const cancelBtn = document.getElementById('modalCancel');
    function onOk(){ cerrar({ok:true, valor:input.value}); }
    function onCancel(){ cerrar({ok:false, valor:null}); }
    function onKey(e){ if(e.key==='Enter') onOk(); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    input.addEventListener('keydown', onKey);
  });
}
function avisar(mensaje){ return abrirModal({mensaje, soloOk:true}); }
function confirmar(mensaje){ return abrirModal({mensaje}).then(r=>r.ok); }
function pedirTexto(mensaje, tipoInput='text'){ return abrirModal({mensaje, conInput:true, tipoInput}).then(r=> r.ok ? r.valor : null); }

async function iniciarSesionPersonal(rolSolicitado){
  if(!supabaseClient){
    await avisar('Falta configurar la URL y la clave pública de Supabase en supabase-config.js.');
    return;
  }
  const email = await pedirTexto('Correo de acceso:', 'email');
  if(email===null) return;
  const password = await pedirTexto('Contraseña:', 'password');
  if(password===null) return;

  try{
    const {data, error} = await supabaseClient.auth.signInWithPassword({email:email.trim(), password});
    if(error) throw error;
    const {data:staff, error:roleError} = await supabaseClient
      .from('staff_roles').select('role').eq('user_id', data.user.id).maybeSingle();
    if(roleError) throw roleError;
    if(!staff || staff.role !== rolSolicitado){
      await supabaseClient.auth.signOut();
      await avisar('Esta cuenta no tiene asignado el perfil seleccionado.');
      return;
    }
    await entrarDashboard(staff.role);
  }catch(error){
    await avisar('No se pudo iniciar sesión. ' + (error.message || 'Verifica tus datos y la configuración de Supabase.'));
  }
}
document.getElementById('btnRolAdmin').addEventListener('click', ()=>iniciarSesionPersonal('admin'));
document.getElementById('btnRolEmpleado').addEventListener('click', ()=>iniciarSesionPersonal('empleado'));

async function restaurarSesionPersonal(){
  if(!supabaseClient) return;
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session) return;
    const {data:staff} = await supabaseClient
      .from('staff_roles').select('role').eq('user_id', session.user.id).maybeSingle();
    if(staff && (staff.role==='admin' || staff.role==='empleado')) await entrarDashboard(staff.role);
  }catch(error){
    console.error('No se pudo restaurar la sesión:', error);
  }
}

  document.getElementById('rolTag').textContent = rol==='admin' ? 'Panel administrador' : 'Panel empleado';

  currentFilter = 'todos';

  document.querySelector('#filtros [data-f="pago_en_proceso"]').style.display = rol==='admin' ? '' : 'none';

function renderTarjetaEstado(pedido){
  const mostrarMontos = pedido.total!==null;
  const total = mostrarMontos ? Number(pedido.total)||0 : 0;
  const anticipo = Number(pedido.anticipo)||0;
  const saldo = mostrarMontos ? (pedido.estatus_pago==='pagado' ? 0 : total-anticipo) : 0;
  const pasos = ['pendiente','proceso','terminado'];
  const idx = pasos.indexOf(pedido.estatus);
  const estatusLabel = {pendiente:'En diseño', proceso:'En proceso', terminado:'Terminado — listo para recoger'}[pedido.estatus];
  return `
    <div class="estado-cliente">
      <div class="folio">Pedido #${String(pedido.folio).padStart(4,'0')}</div>
      <span class="pill ${pedido.estatus}">${estatusLabel}</span>
      <div class="barra-pasos">
        <div class="paso ${idx>=0?'on':''}"></div>
        <div class="paso ${idx>=1?'on':''}"></div>
        <div class="paso ${idx>=2?'on':''}"></div>
      </div>
      <div class="fila"><span>Fecha de entrega</span><b>${pedido.fecha_entrega||'Por confirmar'}</b></div>
      ${pedido.hora_entrega?`<div class="fila"><span>Hora de entrega</span><b>${escapeHtml(pedido.hora_entrega)}</b></div>`:''}
      ${mostrarMontos?`
        <div class="fila"><span>Total</span><b>$${fmt(total)}</b></div>
        <div class="fila"><span>Anticipo</span><b>$${fmt(anticipo)}</b></div>
      `:''}
      <div class="fila"><span>Estatus de pago</span><b>${ETIQUETAS_PAGO[pedido.estatus_pago] || 'Pendiente'}</b></div>
      ${mostrarMontos?`<div class="fila"><span>${saldo>0.009?'Saldo pendiente':'Estatus de saldo'}</span><b>${saldo>0.009?'$'+fmt(saldo):'Liquidado'}</b></div>`:''}
    </div>
  `;
}

function telefonoE164(valor){
  const digitos = valor.replace(/\D/g,'');
  if(digitos.length===10) return '+52'+digitos;
  if(digitos.length===12 && digitos.startsWith('52')) return '+'+digitos;
  if(digitos.length===13 && digitos.startsWith('521')) return '+52'+digitos.slice(3);
  if(valor.trim().startsWith('+') && digitos.length>=11) return '+'+digitos;
  throw new Error('Escribe un número de WhatsApp válido con lada.');
}

async function buscarPedidoPublico(){
  const folioTexto = document.getElementById('c_folio').value.trim().replace(/^#\s*/, '');
  const cont = document.getElementById('consultaResultado');

  if(!/^\d+$/.test(folioTexto) || Number(folioTexto)<=0){
    cont.innerHTML = `<div class="estado-cliente">Escribe un número de folio válido.</div>`;
    return;
  }

  try{
    if(!supabaseClient) throw new Error('La consulta de pedidos todavía no está configurada.');
    const {data, error} = await supabaseClient.rpc('consultar_pedido_por_folio', {
      folio_buscado:Number(folioTexto)
    });
    if(error) throw error;
    const pedidos = data || [];

    if(pedidos.length===0){
      cont.innerHTML = `<div class="estado-cliente">No encontramos ningún pedido con ese folio.</div>`;
      return;
    }

    cont.innerHTML = pedidos.map(renderTarjetaEstado).join('');
  }catch(e){
    cont.innerHTML = '';
    await avisar('No se pudo consultar el pedido. ' + (e.message || 'Intenta de nuevo.'));
  }
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function loadState(){
  if(!supabaseClient) throw new Error('Configura la URL y la clave pública de Supabase en supabase-config.js.');
  let data;
  if(currentRole==='empleado'){
    const resultado = await supabaseClient.rpc('pedidos_para_empleado');
    if(resultado.error) throw resultado.error;
    data = resultado.data;
  }else{
    const resultado = await supabaseClient.from('pedidos')
      .select('id, folio, creado, estatus, estatus_pago, datos').order('folio', {ascending:false});
    if(resultado.error) throw resultado.error;
    data = resultado.data;
  }

  if(currentRole==='admin'){
    let legacyOrders = [];
    try{
      const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      const storedOrders = raw ? (JSON.parse(raw).orders || []) : [];
      const remoteIds = new Set((data || []).map(order=>String(order.id)));
      legacyOrders = storedOrders.filter(order=>!remoteIds.has(String(order.id)));
    }catch(e){
      console.warn('No se pudieron leer los pedidos guardados anteriormente.', e);
    }
    if(legacyOrders.length && await confirmar(`Se encontraron ${legacyOrders.length} pedidos guardados en este navegador. ¿Importarlos a Supabase?`)){
      const rows = legacyOrders.map((legacyOrder, index)=>{
        const order = {...legacyOrder, cliente:{...(legacyOrder.cliente || {})}};
        order.id = String(order.id || `legacy-${Date.now()}-${index}`);
        order.creado = order.creado || new Date().toISOString();
        order.estatus = ['pendiente','proceso','terminado'].includes(order.estatus) ? order.estatus : 'pendiente';
        order.folio = Number.isInteger(Number(order.folio)) && Number(order.folio)>0 ? Number(order.folio) : undefined;
        normalizarPedido(order);
        return filaDesdePedido(order, order.folio!==undefined);
      });
      const {error:importError} = await supabaseClient.from('pedidos').insert(rows);
      if(importError) throw importError;
      const {error:sequenceError} = await supabaseClient.rpc('sincronizar_folio_pedidos');
      if(sequenceError) throw sequenceError;
      const refreshed = await supabaseClient.from('pedidos')
        .select('id, folio, creado, estatus, estatus_pago, datos').order('folio', {ascending:false});
      if(refreshed.error) throw refreshed.error;
      data = refreshed.data;
    }
  }

  state.orders = (data || []).map(pedidoDesdeFila);
  render();
}

function pedidoDesdeFila(row){
  return {...row.datos, id:row.id, folio:Number(row.folio), creado:row.creado, estatus:row.estatus,
    estatusPago:row.estatus_pago || 'pendiente'};
}

function filaDesdePedido(order, incluirFolio=false){
  const {id, folio, creado, estatus, estatusPago, ...datos} = order;
  const row = {id, creado, estatus, estatus_pago:estatusPago || 'pendiente', datos};
  if(incluirFolio) row.folio = folio;
  return row;
}

async function guardarPedidoEnSupabase(order, esNuevo){
  let resultado;
  if(currentRole==='empleado' && !esNuevo){
    const {data, error} = await supabaseClient.rpc('actualizar_estatus_pedido', {
      p_pedido_id:order.id,
      p_nuevo_estatus:order.estatus,
      p_nuevo_estatus_pago:order.estatusPago
    });
    if(error) throw error;
    return pedidoDesdeFila(data);
  }
  if(currentRole==='empleado' && esNuevo){
    const {error} = await supabaseClient.from('pedidos').insert(filaDesdePedido(order, true));
    if(error) throw error;
    const {data, error:loadError} = await supabaseClient.rpc('pedidos_para_empleado');
    if(loadError) throw loadError;
    const pedidoCreado = (data || []).find(pedido=>String(pedido.id)===String(order.id));
    if(!pedidoCreado) throw new Error('El pedido se guardó, pero no se pudo recuperar su vista de empleado.');
    return pedidoDesdeFila(pedidoCreado);
  }
  if(esNuevo){
    resultado = await supabaseClient.from('pedidos').insert(filaDesdePedido(order, true))
      .select('id, folio, creado, estatus, estatus_pago, datos').single();
  }else{
    resultado = await supabaseClient.from('pedidos').update(filaDesdePedido(order))
      .eq('id', order.id).select('id, folio, creado, estatus, estatus_pago, datos').single();
  }
  if(resultado.error) throw resultado.error;
  return pedidoDesdeFila(resultado.data);
}

function calcTotales(order){
  const subtotal = order.productos.reduce((a,p)=>a + (Number(p.cantidad)||0)*(Number(p.precio)||0), 0);
  const iva = order.ivaAplica ? subtotal*0.16 : 0;
  const total = subtotal + iva;
  const saldo = order.estatusPago==='pagado' ? 0 : total - (Number(order.anticipo)||0);
  return {subtotal, iva, total, saldo};
}

function render(){
  renderResumen();
  renderLista();
}

function renderResumen(){
  const pendientes = state.orders.filter(o=>o.estatus!=='terminado').length;
  let porCobrar = 0;
  if(currentRole==='admin') state.orders.forEach(o=>{ porCobrar += calcTotales(o).saldo; });
  const hoy = fechaLocalISO();
  const entregasHoy = state.orders.filter(o=>o.fechaEntrega===hoy && o.estatus!=='terminado');

  document.getElementById('resumen').innerHTML = `
    <div class="summary-card"><div class="num">${pendientes}</div><div class="label">Pedidos activos</div></div>
    ${currentRole==='admin'
      ? `<div class="summary-card"><div class="num">$${fmt(porCobrar)}</div><div class="label">Por cobrar (saldos)</div></div>`
      : `<div class="summary-card"><div class="num">${state.orders.filter(o=>o.estatus==='terminado').length}</div><div class="label">Pedidos terminados</div></div>`}
    <div class="summary-card">
      <div class="num">${entregasHoy.length}</div>
      <div class="label">Entregas hoy</div>
      ${entregasHoy.length
        ? `<div class="summary-delivery-list">${entregasHoy.map(order=>`
            <button class="summary-delivery-order" type="button" data-order-id="${escapeHtml(String(order.id))}">${String(order.folio).padStart(4,'0')}${currentRole==='admin'?' · '+escapeHtml(order.cliente?.nombre||'Sin nombre'):''}</button>
          `).join('')}</div>`
        : '<div class="summary-delivery-empty">Sin entregas pendientes</div>'}
    </div>
  `;
}

function fechaLocalISO(fecha=new Date()){
  return [fecha.getFullYear(), String(fecha.getMonth()+1).padStart(2,'0'), String(fecha.getDate()).padStart(2,'0')].join('-');
}

function programarActualizacionDiaria(){
  const ahora = new Date();
  const siguienteMedianoche = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()+1);
  window.setTimeout(()=>{
    renderResumen();
    programarActualizacionDiaria();
  }, siguienteMedianoche.getTime()-ahora.getTime());
}
programarActualizacionDiaria();

document.getElementById('resumen').addEventListener('click', event=>{
  const botonPedido = event.target.closest('.summary-delivery-order');
  if(!botonPedido) return;
  abrirPedido(botonPedido.dataset.orderId);
});

function normalizarBusqueda(texto){
  return String(texto||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

function fechaHoyLocal(){
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
}

function pasaFiltro(o){
  const busqueda = normalizarBusqueda(document.getElementById('buscarCliente').value);
  const busquedaFolio = busqueda.replace(/^#/, '');
  const folio = String(o.folio ?? '');
  const coincideNombre = normalizarBusqueda(o.cliente?.nombre).includes(busqueda);
  const coincideFolio = busquedaFolio && (
    folio.includes(busquedaFolio) || folio.padStart(4,'0').includes(busquedaFolio)
  );
  if(busqueda && !coincideNombre && !coincideFolio) return false;
  if(currentFilter==='todos') return true;
  if(currentFilter==='urgente') return o.tipoPedido === 'urgente' || o.fechaEntrega === fechaHoyLocal();
  if(currentFilter==='debe') return calcTotales(o).saldo > 0.009;
  if(currentFilter==='pago_en_proceso') return o.estatusPago === 'en_proceso';
  if(currentFilter==='pagado') return o.estatusPago === 'pagado';
  return o.estatus === currentFilter;
}

function renderLista(){
  const cont = document.getElementById('lista');
  const items = [...state.orders].sort((a,b)=> b.folio - a.folio).filter(pasaFiltro);

  if(items.length===0){
    cont.innerHTML = `<div class="empty">
      <div class="eye-big"></div>
      <div style="font-weight:600;color:#1A1A1A;margin-bottom:4px;">Sin pedidos que mostrar</div>
      <div style="font-size:13px;">Crea un pedido nuevo con el botón de arriba.</div>
    </div>`;
    return;
  }

  cont.innerHTML = items.map(o=>{
    const restringido = pedidoEmpleadoRestringido(o);
    const estatusLabel = {pendiente:'En diseño', proceso:'En proceso', terminado:'Terminado'}[o.estatus];
    const detallesPedido = (o.productos||[]).map(producto=>`
      <div class="order-detail">
        <span class="order-detail-name">${escapeHtml(producto.desc||'Sin descripción')}</span>
        <span class="order-detail-quantity">Cant. ${escapeHtml(String(producto.cantidad??''))}</span>
      </div>
    `).join('');
    const notasInternas = String(o.notas||'').trim();
    return `
      <div class="order-card" onclick="abrirPedido('${o.id}')">
        <div class="order-top">
          <div>
            <div class="folio">Pedido ${String(o.folio).padStart(4,'0')}</div>
            <div class="order-details">${detallesPedido||'<div class="order-detail-name">Sin detalles registrados</div>'}</div>
            ${notasInternas?`<div class="order-notes"><span class="order-notes-label">Nota interna</span>${escapeHtml(notasInternas)}</div>`:''}
            <div class="cliente-nombre">Cliente: ${escapeHtml(o.cliente?.nombre||'Sin nombre')}</div>
            ${restringido?'':`<div class="order-meta">Entrega: ${o.fechaEntrega || 'sin definir'}${o.horaEntrega ? ' · ' + escapeHtml(o.horaEntrega) : ''}</div>`}
            <div class="order-meta">Teléfono: ${escapeHtml(String(o.cliente?.whatsapp||'No registrado'))}</div>
          </div>
          <div class="order-statuses">
            <span class="pill ${o.estatus}">${estatusLabel}</span>
            ${o.tipoPedido==='urgente' ? '<span class="pill urgente">Urgente</span>' : ''}
            <span class="pill ${{pagado:'pagado', en_proceso:'pago-en-proceso'}[o.estatusPago] || 'pago-pendiente'}">Pago: ${ETIQUETAS_PAGO[o.estatusPago] || 'Pendiente'}</span>
          </div>
        </div>
        ${restringido?'':(()=>{
          const t = calcTotales(o);
          const saldoClass = t.saldo > 0.009 ? 'saldo-pos' : 'saldo-ok';
          return `<div class="order-money">
            <span>Total: <b>$${fmt(t.total)}</b></span>
            <span class="${saldoClass}">${t.saldo>0.009 ? 'Debe $'+fmt(t.saldo) : 'Liquidado'}</span>
          </div>`;
        })()}
        ${restringido && o.estatusPago!=='pagado' && Number(o.saldoPendiente)>0.009
          ? `<div class="employee-balance">Saldo pendiente: <strong>$${fmt(o.saldoPendiente)}</strong></div>`
          : ''}
        ${o.fechaEntrega && o.horaEntrega && o.estatus!=='terminado'
          ? `<div class="entrega-timer" data-entrega="${escapeHtml(o.fechaEntrega)}T${escapeHtml(o.horaEntrega)}"></div>`
          : ''}
        <div class="order-edit-hint">Toca para editar →</div>
      </div>
    `;
  }).join('');
  actualizarTemporizadores();
}

function formatoTiempo(ms){
  const total = Math.floor(ms/1000);
  const dias = Math.floor(total/86400);
  const h = Math.floor((total%86400)/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  const hms = [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
  return dias>0 ? `${dias}d ${hms}` : hms;
}

function actualizarTemporizadores(){
  const ahora = Date.now();
  document.querySelectorAll('.entrega-timer').forEach(el=>{
    const objetivo = new Date(el.dataset.entrega).getTime();
    if(Number.isNaN(objetivo)){ el.textContent = ''; return; }
    const restante = objetivo - ahora;
    if(restante <= 0){
      el.textContent = '⏱ Vencido';
      el.className = 'entrega-timer vencido';
    }else{
      el.textContent = `⏱ Faltan ${formatoTiempo(restante)}`;
      el.className = 'entrega-timer' + (restante <= 3600000 ? ' critico' : restante < 86400000 ? ' pronto' : '');
    }
  });
}
setInterval(actualizarTemporizadores, 1000);

function normalizarPedido(o){
  if(!o.cliente) o.cliente = {nombre:'', whatsapp:'', correo:''};
  if(o.cliente.nombre===undefined) o.cliente.nombre = '';
  if(o.cliente.correo===undefined) o.cliente.correo = '';
  if(!o.facturacion) o.facturacion = {razonSocial:'', rfc:'', regimenFiscal:'', nombreComercial:'', calle:'', numero:'', colonia:'', codigoPostal:'', municipio:'', estado:''};
  if(!o.estatusPago) o.estatusPago = 'pendiente';
  if(o.atendidoPor===undefined) o.atendidoPor = '';
  if(o.metodoPago===undefined) o.metodoPago = '';
  if(typeof o.horaEntrega !== 'string') o.horaEntrega = '';
  if(!['normal','urgente'].includes(o.tipoPedido)) o.tipoPedido = 'normal';
  if(o.domicilioEntrega===undefined) o.domicilioEntrega = '';
  if(o.cliente.whatsapp===undefined) o.cliente.whatsapp = o.cliente.telefono || '';
  delete o.cliente.telefono;
  return o;
}

}

function opcionesClientesRegistrados(campo){
  const valores = new Set();
  state.orders.forEach(order=>{
    const valor = campo==='nombre' ? order.cliente?.nombre : order.cliente?.whatsapp;
    if(valor && valor.trim()) valores.add(valor.trim());
  });
  return [...valores].map(valor=>`<option value="${escapeHtml(valor)}"></option>`).join('');
}

function normalizarTelefonoCliente(valor){
  const digitos = valor.replace(/\D/g,'');
  if(digitos.length===10) return '52'+digitos;
  if(digitos.length===13 && digitos.startsWith('521')) return '52'+digitos.slice(3);
  return digitos;
}

function buscarClienteRegistrado(campo, valor){
  const buscar = campo==='nombre' ? valor.trim().toLocaleLowerCase('es-MX') : normalizarTelefonoCliente(valor);
  if(!buscar) return null;

  const coincidencias = state.orders.filter(order=>{
    const cliente = order.cliente || {};
    const dato = campo==='nombre' ? cliente.nombre : cliente.whatsapp;
    if(!dato) return false;
    return campo==='nombre'
      ? dato.trim().toLocaleLowerCase('es-MX')===buscar
      : normalizarTelefonoCliente(dato)===buscar;
  }).sort((a,b)=>Number(b.folio||0)-Number(a.folio||0));

  if(!coincidencias.length) return null;
  const perfil = {cliente:{nombre:'', whatsapp:'', correo:''}, facturacion:{}};
  const camposCliente = ['nombre', 'whatsapp', 'correo'];
  const camposFacturacion = ['razonSocial', 'rfc', 'regimenFiscal', 'nombreComercial', 'calle', 'numero', 'colonia', 'codigoPostal', 'municipio', 'estado'];
  coincidencias.forEach(order=>{
    const cliente = order.cliente || {};
    const facturacion = order.facturacion || {};
    camposCliente.forEach(campo=>{
      if(!perfil.cliente[campo] && cliente[campo]) perfil.cliente[campo] = cliente[campo];
    });
    camposFacturacion.forEach(campo=>{
      if(!perfil.facturacion[campo] && facturacion[campo]) perfil.facturacion[campo] = facturacion[campo];
    });
  });
  return perfil;
}

function autocompletarDatosCliente(campo){
  const valor = document.getElementById(campo==='nombre' ? 'f_nombre' : 'f_wa').value;
  const perfil = buscarClienteRegistrado(campo, valor);
  if(!perfil) return;

  document.getElementById('f_nombre').value = perfil.cliente.nombre;
  document.getElementById('f_wa').value = perfil.cliente.whatsapp;
  document.getElementById('f_correo').value = perfil.cliente.correo;
  Object.entries({
    razonSocial:'fc_razonSocial', rfc:'fc_rfc', regimenFiscal:'fc_regimenFiscal',
    nombreComercial:'fc_nombreComercial', calle:'fc_calle', numero:'fc_numero',
    colonia:'fc_colonia', codigoPostal:'fc_codigoPostal', municipio:'fc_municipio', estado:'fc_estado'
  }).forEach(([campo, id])=>{
    document.getElementById(id).value = perfil.facturacion[campo] || '';
  });
}

function toast(msg){
  let t = document.getElementById('toastMsg');
  if(!t){
    t = document.createElement('div');
    t.id='toastMsg';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 2200);
}

async function guardarDesdeForm(){
  try{
    const esEmpleado = currentRole==='empleado';
    const esNuevo = !editingId;
    if(!esEmpleado || esNuevo) leerFormAlDraft();
    if((!esEmpleado || esNuevo) && !draftOrder.cliente.nombre){
      await avisar('Falta el nombre del cliente.');
      return;
    }
    if((!esEmpleado || esNuevo) && !draftOrder.atendidoPor){
      await avisar('Indica quién atendió el pedido ("Atendido por").');
      return;
    }
    if(esEmpleado && esNuevo && !ATENDIDO_POR_OPCIONES.includes(draftOrder.atendidoPor)){
      await avisar('Selecciona una opción válida en "Atendido por".');
      return;
    }
    const pedidoGuardado = await guardarPedidoEnSupabase(draftOrder, esNuevo);
    const idx = state.orders.findIndex(x=>x.id===pedidoGuardado.id);
    if(idx===-1) state.orders.push(pedidoGuardado);
    else state.orders[idx] = pedidoGuardado;
    editingId = pedidoGuardado.id;
    render();
    closeDrawer();
    toast('Pedido guardado ✓');
  }catch(e){
    console.error('Error al guardar pedido:', e);
    await avisar('No se pudo guardar el pedido. Detalle: ' + (e && e.message ? e.message : e));
  }
}

async function generarNota(tipo){
  leerFormAlDraft();
  if(currentRole==='admin' && !draftOrder.atendidoPor){
    await avisar('Indica quién atendió el pedido ("Atendido por").');
    return;
  }
  const cont = document.getElementById('nota-render');
  cont.innerHTML = construirNotaHTML(draftOrder);
  const posicionOriginal = {left:cont.style.left, top:cont.style.top, visibility:cont.style.visibility};
  cont.style.left = '0px';
  cont.style.top = '0px';
  cont.style.visibility = 'hidden';

  let canvas;
  try{
    const imagenesRedes = Array.from(cont.querySelectorAll('img.nota-redes-icon'));
    await Promise.all(imagenesRedes.map(imagen=>imagen.decode()));
    canvas = await html2canvas(cont, {
      scale:2,
      backgroundColor:'#ffffff',
      windowWidth:window.innerWidth,
      windowHeight:Math.max(window.innerHeight, cont.scrollHeight),
      scrollX:0,
      scrollY:0,
      onclone:clonedDocument=>{
        const notaClonada = clonedDocument.getElementById('nota-render');
        if(notaClonada) notaClonada.style.visibility = 'visible';
      }
    });
  }finally{
    cont.style.left = posicionOriginal.left;
    cont.style.top = posicionOriginal.top;
    cont.style.visibility = posicionOriginal.visibility;
  }

  const folioStr = String(draftOrder.folio).padStart(4,'0');
  if(tipo==='jpg'){
    const link = document.createElement('a');
    link.download = `pedido-${folioStr}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  } else {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    const pageWidth = 210;
    const pageHeight = 297;
    const pageMargin = 10;
    const printableWidth = pageWidth - pageMargin * 2;
    const printableHeight = pageHeight - pageMargin * 2;
    const pixelsPerMm = canvas.width / printableWidth;
    const maxPagePixels = Math.floor(printableHeight * pixelsPerMm);
    const notaBounds = cont.getBoundingClientRect();
    const escalaCanvas = canvas.width / notaBounds.width;
    const cortesSeguros = Array.from(cont.querySelectorAll(
      '.nota-head, .nota-cliente, .nota-tabla thead, .nota-tabla tbody tr, .nota-totales, .nota-foot, .nota-redes, .nota-horario, .nota-consulta'
    )).map(elemento=>Math.round((elemento.getBoundingClientRect().bottom - notaBounds.top) * escalaCanvas))
      .filter(corte=>corte>0 && corte<=canvas.height)
      .sort((a,b)=>a-b);
    const encabezadoTabla = cont.querySelector('.nota-tabla thead');
    const altoEncabezado = encabezadoTabla
      ? Math.ceil(encabezadoTabla.getBoundingClientRect().height * escalaCanvas)
      : 0;
    const inicioEncabezado = encabezadoTabla
      ? Math.round((encabezadoTabla.getBoundingClientRect().top - notaBounds.top) * escalaCanvas)
      : 0;

    const enlaces = Array.from(cont.querySelectorAll('.nota-link')).flatMap(el=>
      Array.from(el.getClientRects()).map(r=>({
        x:(r.left - notaBounds.left) * escalaCanvas,
        w:r.width * escalaCanvas,
        top:(r.top - notaBounds.top) * escalaCanvas,
        bottom:(r.bottom - notaBounds.top) * escalaCanvas
      })));

    let inicio = 0;
    let numeroPagina = 0;
    while(inicio < canvas.height){
      const repetirEncabezado = numeroPagina > 0 && altoEncabezado > 0;
      const altoDisponible = maxPagePixels - (repetirEncabezado ? altoEncabezado : 0);
      const limite = Math.min(canvas.height, inicio + altoDisponible);
      const cortesPagina = cortesSeguros.filter(corte=>corte>inicio && corte<=limite);
      const fin = limite===canvas.height ? canvas.height : (cortesPagina.pop() || limite);
      const altoContenido = fin - inicio;
      const altoPagina = altoContenido + (repetirEncabezado ? altoEncabezado : 0);
      const paginaCanvas = document.createElement('canvas');
      paginaCanvas.width = canvas.width;
      paginaCanvas.height = altoPagina;
      const contexto = paginaCanvas.getContext('2d');

      if(repetirEncabezado){
        contexto.drawImage(canvas, 0, inicioEncabezado, canvas.width, altoEncabezado, 0, 0, canvas.width, altoEncabezado);
      }
      contexto.drawImage(canvas, 0, inicio, canvas.width, altoContenido, 0,
        repetirEncabezado ? altoEncabezado : 0, canvas.width, altoContenido);

      if(numeroPagina > 0) pdf.addPage();
      const altoEnMm = altoPagina / pixelsPerMm;
      pdf.addImage(paginaCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', pageMargin, pageMargin, printableWidth, altoEnMm);
      const desplazamiento = repetirEncabezado ? altoEncabezado : 0;
      enlaces.filter(e=>e.top>=inicio && e.bottom<=fin).forEach(e=>{
        pdf.link(
          pageMargin + e.x / pixelsPerMm,
          pageMargin + (e.top - inicio + desplazamiento) / pixelsPerMm,
          e.w / pixelsPerMm,
          (e.bottom - e.top) / pixelsPerMm,
          {url:'https://yaviste.vercel.app/'}
        );
      });
      inicio = fin;
      numeroPagina++;
    }
    pdf.save(`pedido-${folioStr}.pdf`);
  }
}

function abrirWhatsapp(){
  leerFormAlDraft();
  const numero = (draftOrder.cliente.whatsapp || '').replace(/\D/g,'');
  if(!numero){
    avisar('Agrega un número de WhatsApp o teléfono del cliente primero.');
    return;
  }
  const t = calcTotales(draftOrder);
  const folioStr = String(draftOrder.folio).padStart(4,'0');
  const msg = `Hola ${draftOrder.cliente.nombre||''}, te compartimos tu pedido #${folioStr} de Ya Viste.\\nTotal: $${fmt(t.total)}\\nAnticipo: $${fmt(draftOrder.anticipo)}\\n${t.saldo>0.009 ? 'Saldo pendiente: $'+fmt(t.saldo) : 'Pedido liquidado'}\\nFecha de entrega: ${draftOrder.fechaEntrega||'por confirmar'}\\n\\nEn un momento te enviamos tu nota en imagen o PDF. ¡Gracias por tu preferencia!`;
  const url = `https://wa.me/52${numero}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  avisar('Se abrió WhatsApp con el mensaje listo. Descarga la nota (JPG o PDF) y adjúntala manualmente en el chat, ya que WhatsApp no permite adjuntar archivos automáticamente desde un enlace.');
}

function exportarExcel(){
  if(state.orders.length===0){
    avisar('Todavía no hay pedidos guardados para exportar.');
    return;
  }
  const pedidosRows = [];
  const detalleRows = [];
  const facturacionRows = [];

  [...state.orders].sort((a,b)=>a.folio-b.folio).forEach(o=>{
    const t = calcTotales(o);
    const f = o.facturacion || {};
    pedidosRows.push({
      'Folio': String(o.folio).padStart(4,'0'),
      'Fecha creado': new Date(o.creado).toLocaleDateString('es-MX'),
      'Cliente': o.cliente.nombre,
      'WhatsApp': o.cliente.whatsapp,
      'Correo': o.cliente.correo,
      'Fecha de entrega': o.fechaEntrega,
      'Domicilio de entrega': o.domicilioEntrega||'',
      'Método de pago': o.metodoPago||'',
      'Estatus': {pendiente:'En diseño', proceso:'En proceso', terminado:'Terminado'}[o.estatus],
      'Subtotal': Number(t.subtotal.toFixed(2)),
      'IVA': Number(t.iva.toFixed(2)),
      'Total': Number(t.total.toFixed(2)),
      'Anticipo': Number((Number(o.anticipo)||0).toFixed(2)),
      'Saldo pendiente': Number(t.saldo.toFixed(2)),
      'Notas': o.notas
    });
    if(f.razonSocial || f.rfc){
      facturacionRows.push({
        'Folio': String(o.folio).padStart(4,'0'),
        'Cliente': o.cliente.nombre,
        'Nombre comercial': f.nombreComercial||'',
        'Razón social': f.razonSocial||'',
        'RFC': f.rfc||'',
        'Régimen fiscal': f.regimenFiscal||'',
        'Calle': f.calle||'',
        'Número': f.numero||'',
        'Colonia': f.colonia||'',
        'Código postal': f.codigoPostal||'',
        'Municipio': f.municipio||'',
        'Estado': f.estado||''
      });
    }
    o.productos.forEach(p=>{
      detalleRows.push({
        'Folio': String(o.folio).padStart(4,'0'),
        'Cliente': o.cliente.nombre,
        'Descripción': p.desc,
        'Cantidad': Number(p.cantidad)||0,
        'Precio unitario': Number(p.precio)||0,
        'Importe': Number(((Number(p.cantidad)||0)*(Number(p.precio)||0)).toFixed(2))
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const wsPedidos = XLSX.utils.json_to_sheet(pedidosRows);
  const wsDetalle = XLSX.utils.json_to_sheet(detalleRows);
  XLSX.utils.book_append_sheet(wb, wsPedidos, 'Pedidos');
  XLSX.utils.book_append_sheet(wb, wsDetalle, 'Detalle productos');
  if(facturacionRows.length>0){
    const wsFacturacion = XLSX.utils.json_to_sheet(facturacionRows);
    XLSX.utils.book_append_sheet(wb, wsFacturacion, 'Facturación');
  }

  const hoy = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `pedidos-ya-viste-${hoy}.xlsx`);
}

document.getElementById('btnExportar').addEventListener('click', exportarExcel);
