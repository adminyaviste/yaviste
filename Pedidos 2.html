<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ya Viste — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1A1A1A;
    --paper:#F7F5EF;
    --paper-2:#FFFFFF;
    --line:#E3DFD3;
    --cyan:#00AEEF;
    --magenta:#E6007E;
    --yellow:#FFC400;
    --teal:#0B4F6C;
    --teal-dark:#083A50;
    --muted:#78736A;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Archivo Black',sans-serif;}

  header.app{
    background:var(--teal-dark);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.app .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.app .eye{
    width:30px;height:30px;border-radius:50%;
    background:conic-gradient(var(--cyan),var(--magenta),var(--yellow),var(--cyan));
    flex-shrink:0;
    position:relative;
  }
  header.app .eye::after{
    content:"";
    position:absolute;inset:9px;
    background:var(--teal-dark);
    border-radius:50%;
  }
  header.app h1{
    font-size:17px;
    margin:0;
    letter-spacing:0.3px;
  }
  header.app .sub{
    font-size:11px;
    color:#B7CBD3;
    margin-top:1px;
  }
  .btn{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--magenta);color:#fff;}
  .btn-secondary{background:#fff;color:var(--teal-dark);border:1.5px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--teal-dark);padding:8px 10px;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-wa{background:#25D366;color:#fff;}
  .btn-cotizacion{background:var(--yellow);color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  main{
    max-width:980px;
    margin:0 auto;
    padding:20px 16px 80px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px 10px;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:16px;
  }
  .filters{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    flex:1 1 100%;
  }
  .status-filter{position:relative;flex:0 0 auto;}
  .status-filter-toggle{white-space:nowrap;}
  .status-filter-menu{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:10;
    display:none;
    min-width:170px;
    padding:6px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
  }
  .status-filter.open .status-filter-menu{display:grid;gap:4px;}
  .status-filter-menu .chip{width:100%;text-align:left;border-radius:7px;}
  .date-filter-menu{min-width:240px;}
  .date-filter-menu label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .date-filter-menu input[type="date"]{height:34px;padding:0 8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-weight:500;color:var(--ink);background:var(--paper-2);}
  .search-row{margin-bottom:12px;}
  .search-cliente{width:100%;max-width:280px;height:38px;padding:0 11px;}
  @media (max-width:700px){
    header.app{padding:12px 14px;align-items:flex-start;flex-wrap:wrap;}
    header.app .brand{min-width:0;}
    header.app h1{font-size:15px;}
    header.app > div:last-child{width:100%;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px!important;}
    header.app > div:last-child .btn{justify-content:center;min-width:0;padding:9px 8px;font-size:12px;}
    main{padding:14px 10px 64px;}
    .search-cliente{max-width:none;flex-basis:100%;}
    .date-filter-menu{min-width:min(240px,calc(100vw - 28px));}
    .filters{flex-wrap:wrap;overflow:visible;padding:1px 0 5px;}
    .filters .chip{flex:0 0 auto;}
    .summary-row{grid-template-columns:repeat(2,minmax(0,1fr));}
    .summary-row{gap:8px;margin-bottom:14px;}
    .summary-card{padding:10px 11px;}
    .summary-card .num{font-size:18px;}
    .order-card{padding:12px;margin-bottom:8px;border-radius:10px;}
    .order-review-control{margin-bottom:5px;}
    .order-review-label{font-size:11px;}
    .order-review-legend{max-width:190px;font-size:10px;}
    .order-content-row{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:8px;}
    .order-image-thumb{width:60px;height:60px;flex-basis:60px;margin:2px 0 0;}
    .order-top{display:block;padding-right:0;}
    .folio{font-size:20px;}
    .order-statuses{justify-content:flex-start;margin-top:8px;gap:5px;}
    .pill{font-size:10px;padding:4px 8px;}
    .order-details{margin-top:7px;padding:7px 8px;}
    .order-detail{font-size:12px;gap:6px;}
    .order-detail-quantity{font-size:11px;}
    .cliente-nombre,.cliente-telefono{font-size:13px;}
    .order-meta{font-size:11px;line-height:1.35;}
    .order-notes{font-size:11.5px;padding:7px 8px;}
    .order-money{font-size:12px;gap:8px;}
    .employee-balance{margin-top:8px;padding:8px 10px;font-size:12px;}
    .order-edit-hint{font-size:10px;margin-top:5px;}
  }
  @media (max-width:480px){
    .summary-row{grid-template-columns:1fr;}
    .order-card{padding:11px;}
    .order-content-row{display:flex;flex-direction:column;gap:8px;}
    .order-image-thumb{width:72px;height:72px;flex-basis:72px;margin:0;align-self:flex-end;}
    .order-card-head{gap:6px;}
    .order-review-legend{max-width:150px;}
    .order-money{flex-wrap:wrap;justify-content:flex-start;gap:4px 14px;}
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--paper-2);
    padding:6px 12px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
  }
  .chip.active{
    border-color:var(--teal);
    color:var(--teal-dark);
    background:#E8F1F4;
  }
  .entrega-timer{margin-top:8px;font-size:12.5px;font-weight:700;color:#1E8E3E;font-variant-numeric:tabular-nums;}
  .entrega-timer.pronto{color:#C79100;}
  .entrega-timer.critico,.entrega-timer.vencido{color:#C62828;}
  .chip[data-f="debe"]{margin-left:0;}
  .chip[data-f="pendiente"],.chip[data-f="proceso"],.chip[data-f="pago_en_proceso"],.chip[data-f="anticipo_recibido"]{border-color:#E0A800;color:#8A6500;background:#FFF6D1;}
  .chip[data-f="pendiente"].active,.chip[data-f="proceso"].active,.chip[data-f="pago_en_proceso"].active,.chip[data-f="anticipo_recibido"].active{background:#F5C518;border-color:#E0A800;color:#3B2F00;}
  .chip[data-f="proceso"]{border-color:#1976D2;color:#1565C0;background:#E8F1FF;}
  .chip[data-f="proceso"].active{background:#1976D2;border-color:#1976D2;color:#fff;}
  .chip[data-f="terminado"],.chip[data-f="pagado"]{border-color:#1E8E3E;color:#1E8E3E;background:#E6F4EA;}
  .chip[data-f="terminado"].active,.chip[data-f="pagado"].active{background:#1E8E3E;border-color:#1E8E3E;color:#fff;}
  .chip[data-f="urgente"],.chip[data-f="debe"]{border-color:#C62828;color:#C62828;background:#FDECEC;}
  .chip[data-f="urgente"].active,.chip[data-f="debe"].active{background:#C62828;border-color:#C62828;color:#fff;}
  #filtros .chip{
    border-width:1px;
    font-weight:700;
    filter:saturate(1.35);
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  }
  #filtros .chip:hover{
    transform:translateY(-2px) scale(1.04);
    filter:saturate(1.55) brightness(1.04);
    box-shadow:0 5px 12px rgba(8,58,80,.2);
  }
  #filtros .chip:focus-visible{outline:3px solid rgba(0,174,239,.45);outline-offset:2px;}
  #filtros .chip[data-f="anticipo_recibido"]{background:#FFE8CC;border-color:#F28C00;color:#B35F00;}
  #filtros .chip[data-f="anticipo_recibido"].active{background:#F28C00;border-color:#F28C00;color:#fff;}
  #filtros .chip,#filtros .chip.active{color:#000!important;}
  #filtros .chip[data-f="todos"]{background:#3F5F96;border-color:#3F5F96;color:#fff!important;}
  #filtros .chip[data-f="todos"].active{background:#0B2A5B;border-color:#0B2A5B;color:#fff!important;}
  @media (prefers-reduced-motion:reduce){
    #filtros .chip{transition:none;}
    #filtros .chip:hover{transform:none;}
  }

  .summary-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:18px;
  }
  .summary-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .summary-card .num{font-family:'Archivo Black';font-size:20px;}
  .summary-card .label{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .summary-order-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:104px;overflow-y:auto;}
  .summary-order-link{padding:0;border:0;background:none;color:var(--teal-dark);font:500 11px 'Inter',sans-serif;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .summary-order-link:hover{text-decoration:underline;}
  .summary-order-empty{margin-top:8px;color:var(--muted);font-size:11px;}

  .order-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    position:relative;
  }
  .common-order-card{
    background:#F1F2F0;
    border:1px solid #E1E3DF;
    border-radius:10px;
    padding:12px 15px;
    margin-bottom:8px;
    color:#5D625E;
  }
  .common-order-title{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#777D78;}
  .common-order-product{margin-top:3px;font-size:14px;font-weight:600;color:#424844;overflow-wrap:anywhere;}
  .common-order-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:11.5px;color:#707671;}
  @media(max-width:700px){
    .common-order-card{padding:10px 12px;margin-bottom:7px;}
    .common-order-product{font-size:13px;}
    .common-order-meta{font-size:11px;}
  }
  .order-check{
    width:20px;
    height:20px;
    margin:0 0 0 6px;
    accent-color:var(--teal);
    cursor:pointer;
  }
  .order-check:disabled{cursor:not-allowed;opacity:.35;}
  .order-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .most-urgent-label{
    margin-bottom:8px;
    color:#F00;
    font-size:13px;
    font-weight:800;
    line-height:1.2;
    text-align:center;
    -webkit-text-stroke:.6px #111;
    paint-order:stroke fill;
  }
  .order-review-control{position:relative;z-index:2;width:max-content;max-width:100%;margin:0 0 8px auto;text-align:right;}
  .order-review-label{display:flex;align-items:center;justify-content:flex-end;color:#16803c;font-size:11.5px;font-weight:700;cursor:pointer;}
  .order-review-legend{max-width:240px;margin-top:2px;color:var(--muted);font-size:10.5px;line-height:1.35;}
  .order-card.revisado{filter:grayscale(1);opacity:.6;background:#EDEDED;}
  .order-image-thumb{
    display:block;
    width:88px;
    height:88px;
    flex:0 0 88px;
    margin:22px 0 0;
    border:1px solid var(--line);
    border-radius:8px;
    object-fit:cover;
  }
  .order-content-row{display:flex;align-items:flex-start;gap:10px;}
  .order-content-main{flex:1;min-width:0;}
  .order-image-preview{
    display:block;
    max-width:100%;
    max-height:240px;
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:8px;
    object-fit:contain;
  }
  .order-top{
    padding-right:30px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .folio{
    font-family:'Archivo Black';
    font-size:23px;
    color:var(--teal-dark);
    line-height:1.15;
  }
  .cliente-nombre,.cliente-telefono{font-weight:700;font-size:14px;color:var(--ink);}
  .cliente-nombre{margin-top:7px;}
  .cliente-telefono{margin-top:2px;}
  .order-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .order-details{
    margin-top:8px;
    border-radius:8px;
    padding:8px 10px;
    background:#E8F5F3;
    color:var(--teal-dark);
  }
  .order-detail{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    font-size:13px;
    font-weight:600;
  }
  .order-detail+.order-detail{margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,105,100,.14);}
  .order-detail-name{overflow-wrap:anywhere;}
  .order-detail-quantity{flex:none;font-size:12px;white-space:nowrap;}
  .order-notes{
    margin-top:7px;
    padding:8px 10px;
    border-left:3px solid #D89A18;
    border-radius:6px;
    background:#FFF6DF;
    color:#674B13;
    font-size:12px;
    line-height:1.45;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .order-notes-label{display:block;margin-bottom:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .pill{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
  }
  .pill.pendiente{background:#FCE4F1;color:var(--magenta);}
  .pill.proceso{background:#DFF3FC;color:#0287BD;}
  .pill.terminado{background:#DEF4E8;color:#1E7A46;}
  .pill.pago-pendiente{background:#FFF2CC;color:#785B00;}
  #btnExportar{background:#1E8E3E;border-color:#1E8E3E;color:#fff;}
  #btnExportar:hover{background:#17712F;border-color:#17712F;}
  .pill.urgente{background:#FDE0E0;color:#B3261E;}
  .pill.pago-en-proceso{background:#DDEFFB;color:#0B4F6C;}
  .pill.anticipo-recibido{background:#FFF2CC;color:#785B00;}
  .pill.pagado{background:#DEF4E8;color:#1E7A46;}
  .order-statuses{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .order-progress{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:10px 0;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);cursor:default;}
  .progress-group{flex:1 1 240px;min-width:0;}
  .progress-group + .progress-group{margin-left:18px;padding-left:18px;border-left:2px solid var(--line);}
  .progress-title{margin-bottom:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .progress-steps{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 22px;}
  .progress-steps.pedido-steps{grid-template-columns:repeat(3,max-content);}
  .progress-step{display:inline-flex;align-items:center;margin:0;min-height:0;gap:6px;color:var(--ink);font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;}
  .progress-step input{appearance:none;-webkit-appearance:none;position:relative;width:16px;height:16px;min-width:16px;margin:0;padding:0;flex:none;cursor:pointer;border:2px solid #8A9BA8;border-radius:4px;background:#fff;transition:background .2s,border-color .2s;}
  .progress-step input::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .2s;}
  .progress-step input:checked{background:var(--teal);border-color:var(--teal);}
  .progress-step input:checked::after{transform:rotate(45deg) scale(1);}
  .progress-step.pago-pagado input:checked{background:#1E9B4F;border-color:#1E9B4F;}
  .progress-step.animar input{animation:casillaPop .45s ease;}
  @keyframes casillaPop{0%{transform:scale(1);}40%{transform:scale(1.5);box-shadow:0 0 0 6px rgba(30,155,79,.25);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(30,155,79,0);}}
  @media (prefers-reduced-motion:reduce){.progress-step.animar input{animation:none;}.progress-step input,.progress-step input::after{transition:none;}}
  .progress-step.locked{cursor:not-allowed;}
  .progress-step.locked input{cursor:not-allowed;}
  .progress-step:not(.checked).locked{opacity:.55;}
  .progress-step.checked{color:var(--ink);}
  @media (max-width:700px){
    .progress-group + .progress-group{margin-left:0;padding-left:0;border-left:0;padding-top:10px;border-top:2px solid var(--line);}
    .progress-group{flex-basis:100%;}
  }
  @media (max-width:700px){
    .progress-steps,.progress-steps.pedido-steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;}
    .progress-step{align-items:flex-start;min-width:0;line-height:1.3;}
  }
  @media (max-width:360px){
    .progress-steps,.progress-steps.pedido-steps{grid-template-columns:minmax(0,1fr);}
  }
  .order-money{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:13px;
  }
  .order-money .saldo-pos{color:var(--danger);font-weight:700;}
  .order-money .saldo-ok{color:#1E7A46;font-weight:700;}
  .employee-balance{
    margin-top:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--muted);
    font-size:13px;
  }
  .employee-balance strong{color:var(--danger);}
  .order-edit-hint{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    margin-top:6px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty .eye-big{
    width:52px;height:52px;border-radius:50%;
    background:conic-gradient(var(--cyan),var(--magenta),var(--yellow),var(--cyan));
    margin:0 auto 14px;
    position:relative;
  }
  .empty .eye-big::after{content:"";position:absolute;inset:16px;background:var(--paper);border-radius:50%;}

  /* Overlay / drawer */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,20,20,0.45);
    z-index:40;
    display:none;
  }
  .overlay.show{display:block;}
  .drawer{
    position:fixed;
    top:0;right:0;bottom:0;
    width:min(480px,100%);
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform .25s ease;
    overflow-y:auto;
    box-shadow:-8px 0 24px rgba(0,0,0,0.15);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    position:sticky;top:0;
    background:var(--teal-dark);
    color:#fff;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:2;
  }
  .drawer-head h2{margin:0;font-size:16px;}
  .drawer-body{padding:18px;}

  label{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    display:block;
    margin-bottom:5px;
    margin-top:14px;
  }
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%;
    padding:10px 11px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

<script>
window.addEventListener('error', function(e){
  console.error('Error capturado:', e.error || e.message);
  avisar('Ocurrió un problema y no se pudo completar la acción. Detalle: ' + (e.message||'error desconocido') + '\n\nIntenta de nuevo; si se repite, avísame el mensaje exacto.');
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Promesa sin manejar:', e.reason);
  const detalle = (e.reason && e.reason.message) ? e.reason.message : e.reason;
  avisar('Ocurrió un problema al guardar/procesar. Detalle: ' + detalle + '\n\nIntenta de nuevo; si se repite, avísame el mensaje exacto.');
});

let state = { orders: [], commonOrders: [] };
let currentFilter = 'todos';
let editingId = null;
let currentRole = null; // 'admin' | 'empleado'
const SUPABASE_CONFIG = window.YAVISTE_SUPABASE_CONFIG || {};
const supabaseClient = window.supabase && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey
  && !SUPABASE_CONFIG.url.includes('YOUR_PROJECT_REF')
  && !SUPABASE_CONFIG.anonKey.includes('YOUR_SUPABASE_')
  ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
    auth:{persistSession:true, autoRefreshToken:true}
  })
  : null;
const LEGACY_STORAGE_KEY = 'yaviste-orders-v1';
const ETIQUETAS_PAGO = {pendiente:'Pendiente', en_proceso:'Pago en proceso', anticipo_recibido:'Anticipo recibido', pagado:'Pagado'};
const PROGRESO_PEDIDO = [{k:'pendiente', l:'En diseño'}, {k:'proceso', l:'En proceso'}, {k:'terminado', l:'Terminado'}];
const PROGRESO_PAGO = Object.keys(ETIQUETAS_PAGO).map(k=>({k, l:ETIQUETAS_PAGO[k]}));

// ---------- Modal propio (prompt/alert/confirm nativos no funcionan en este sandbox) ----------
function abrirModal({mensaje, conInput=false, tipoInput='text', soloOk=false}){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    const box = document.getElementById('modalBox');
    const input = document.getElementById('modalInput');
    document.getElementById('modalMsg').textContent = mensaje;
    input.style.display = conInput ? 'block' : 'none';
    input.type = tipoInput;
    input.value = '';
    document.getElementById('modalCancel').style.display = soloOk ? 'none' : 'inline-flex';

    overlay.classList.add('show');
    box.classList.add('show');
    if(conInput) setTimeout(()=>input.focus(), 50);

    function cerrar(resultado){
      overlay.classList.remove('show');
      box.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKey);
      resolve(resultado);
    }
    const okBtn = document.getElementById('modalOk');
    const cancelBtn = document.getElementById('modalCancel');
    function onOk(){ cerrar({ok:true, valor:input.value}); }
    function onCancel(){ cerrar({ok:false, valor:null}); }
    function onKey(e){ if(e.key==='Enter') onOk(); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    input.addEventListener('keydown', onKey);
  });
}
function avisar(mensaje){ return abrirModal({mensaje, soloOk:true}); }
function confirmar(mensaje){ return abrirModal({mensaje}).then(r=>r.ok); }
function pedirTexto(mensaje, tipoInput='text'){ return abrirModal({mensaje, conInput:true, tipoInput}).then(r=> r.ok ? r.valor : null); }

async function iniciarSesionPersonal(rolSolicitado){
  if(!supabaseClient){
    await avisar('Falta configurar la URL y la clave pública de Supabase en supabase-config.js.');
    return;
  }
  const email = await pedirTexto('Correo de acceso:', 'email');
  if(email===null) return;
  const password = await pedirTexto('Contraseña:', 'password');
  if(password===null) return;

  try{
    const {data, error} = await supabaseClient.auth.signInWithPassword({email:email.trim(), password});
    if(error) throw error;
    const {data:staff, error:roleError} = await supabaseClient
      .from('staff_roles').select('role').eq('user_id', data.user.id).maybeSingle();
    if(roleError) throw roleError;
    if(!staff || staff.role !== rolSolicitado){
      await supabaseClient.auth.signOut();
      await avisar('Esta cuenta no tiene asignado el perfil seleccionado.');
      return;
    }
    await entrarDashboard(staff.role);
  }catch(error){
    await avisar('No se pudo iniciar sesión. ' + (error.message || 'Verifica tus datos y la configuración de Supabase.'));
  }
}
document.getElementById('btnRolAdmin').addEventListener('click', ()=>iniciarSesionPersonal('admin'));
document.getElementById('btnRolEmpleado').addEventListener('click', ()=>iniciarSesionPersonal('empleado'));
function mostrarConsultaCliente(){
  document.getElementById('portal').style.display='none';
  document.getElementById('consulta').style.display='flex';
}
if(new URLSearchParams(window.location.search).get('consulta') === '1') mostrarConsultaCliente();

async function restaurarSesionPersonal(){
  if(!supabaseClient) return;
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session) return;
    const {data:staff} = await supabaseClient
      .from('staff_roles').select('role').eq('user_id', session.user.id).maybeSingle();
    if(staff && (staff.role==='admin' || staff.role==='empleado')) await entrarDashboard(staff.role);
  }catch(error){
    console.error('No se pudo restaurar la sesión:', error);
  }
}
if(new URLSearchParams(window.location.search).get('consulta') !== '1') restaurarSesionPersonal();
document.getElementById('btnVolverPortal').addEventListener('click', ()=>{
  window.location.href='index.html';
});
document.getElementById('btnSalir').addEventListener('click', async ()=>{
  currentRole=null;
  document.getElementById('appRoot').style.display='none';
  document.getElementById('portal').style.display='flex';
  await supabaseClient.auth.signOut();
});

async function entrarDashboard(rol){
  currentRole = rol;
  document.getElementById('portal').style.display='none';
  document.getElementById('appRoot').style.display='block';
  document.getElementById('rolTag').textContent = rol==='admin' ? 'Panel administrador' : 'Panel empleado';
  document.getElementById('btnNuevo').style.display = 'inline-flex';
  document.getElementById('btnPedidoComun').style.display = 'inline-flex';
  document.getElementById('btnExportar').style.display = rol==='admin' ? 'inline-flex' : 'none';
  currentFilter = 'todos';
  document.getElementById('buscarCliente').value = '';
  document.getElementById('fechaDesde').value = '';
  document.getElementById('fechaHasta').value = '';
  document.getElementById('limpiarFechas').style.display = 'none';
  document.querySelectorAll('#filtros .chip').forEach(c=>c.classList.toggle('active', c.dataset.f==='todos'));
  document.querySelectorAll('#filtros .status-filter').forEach(dropdown=>{
    const toggle = dropdown.querySelector('.status-filter-toggle');
    toggle.textContent = toggle.dataset.label + ' ▾';
    toggle.classList.remove('active');
    toggle.setAttribute('aria-expanded', 'false');
    dropdown.classList.remove('open');
  });
  document.getElementById('paymentFilter').style.display = rol==='admin' ? '' : 'none';
  try{
    await loadState();
  }catch(error){
    currentRole = null;
    document.getElementById('appRoot').style.display='none';
    document.getElementById('portal').style.display='flex';
    await avisar('No se pudieron cargar los pedidos de Supabase. ' + (error.message || ''));
  }
}

function renderTarjetaEstado(pedido){
  const mostrarMontos = pedido.total!==null;
  const total = mostrarMontos ? Number(pedido.total)||0 : 0;
  const anticipo = Number(pedido.anticipo)||0;
  const saldo = mostrarMontos ? (pedido.estatus_pago==='pagado' ? 0 : total-anticipo) : 0;
  const pasos = ['pendiente','proceso','terminado'];
  const idx = pasos.indexOf(pedido.estatus);
  const estatusLabel = {pendiente:'En diseño', proceso:'En proceso', terminado:'Terminado — listo para recoger'}[pedido.estatus];
  return `
    <div class="estado-cliente">
      <div class="folio">Pedido #${String(pedido.folio).padStart(4,'0')}</div>
      <span class="pill ${pedido.estatus}">${estatusLabel}</span>
      <div class="barra-pasos">
        <div class="paso ${idx>=0?'on':''}"></div>
        <div class="paso ${idx>=1?'on':''}"></div>
        <div class="paso ${idx>=2?'on':''}"></div>
      </div>
      <div class="fila"><span>Fecha de entrega</span><b>${pedido.fecha_entrega||'Por confirmar'}</b></div>
      ${pedido.hora_entrega?`<div class="fila"><span>Hora de entrega</span><b>${escapeHtml(pedido.hora_entrega)}</b></div>`:''}
      ${mostrarMontos?`
        <div class="fila"><span>Total</span><b>$${fmt(total)}</b></div>
        <div class="fila"><span>Anticipo</span><b>$${fmt(anticipo)}</b></div>
      `:''}
      <div class="fila"><span>Estatus de pago</span><b>${ETIQUETAS_PAGO[pedido.estatus_pago] || 'Pendiente'}</b></div>
      ${mostrarMontos?`<div class="fila"><span>${saldo>0.009?'Saldo pendiente':'Estatus de saldo'}</span><b>${saldo>0.009?'$'+fmt(saldo):'Liquidado'}</b></div>`:''}
    </div>
  `;
}

function telefonoE164(valor){
  const digitos = valor.replace(/\D/g,'');
  if(digitos.length===10) return '+52'+digitos;
  if(digitos.length===12 && digitos.startsWith('52')) return '+'+digitos;
  if(digitos.length===13 && digitos.startsWith('521')) return '+52'+digitos.slice(3);
  if(valor.trim().startsWith('+') && digitos.length>=11) return '+'+digitos;
  throw new Error('Escribe un número de WhatsApp válido con lada.');
}

async function buscarPedidoPublico(){
  const folioTexto = document.getElementById('c_folio').value.trim().replace(/^#\s*/, '');
  const cont = document.getElementById('consultaResultado');

  if(!/^\d+$/.test(folioTexto) || Number(folioTexto)<=0){
    cont.innerHTML = `<div class="estado-cliente">Escribe un número de folio válido.</div>`;
    return;
  }

  try{
    if(!supabaseClient) throw new Error('La consulta de pedidos todavía no está configurada.');
    const {data, error} = await supabaseClient.rpc('consultar_pedido_por_folio', {
      folio_buscado:Number(folioTexto)
    });
    if(error) throw error;
    const pedidos = data || [];

    if(pedidos.length===0){
      cont.innerHTML = `<div class="estado-cliente">No encontramos ningún pedido con ese folio.</div>`;
      return;
    }

    cont.innerHTML = pedidos.map(renderTarjetaEstado).join('');
  }catch(e){
    cont.innerHTML = '';
    await avisar('No se pudo consultar el pedido. ' + (e.message || 'Intenta de nuevo.'));
  }
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function loadState(){
  if(!supabaseClient) throw new Error('Configura la URL y la clave pública de Supabase en supabase-config.js.');
  let data;
  if(currentRole==='empleado'){
    const resultado = await supabaseClient.rpc('pedidos_para_empleado');
    if(resultado.error) throw resultado.error;
    data = resultado.data;
  }else{
    const resultado = await supabaseClient.from('pedidos')
      .select('id, folio, creado, estatus, estatus_pago, pago_marcado_en, revisado, datos').order('folio', {ascending:false});
    if(resultado.error) throw resultado.error;
    data = resultado.data;
  }

  if(currentRole==='admin'){
    let legacyOrders = [];
    try{
      const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      const storedOrders = raw ? (JSON.parse(raw).orders || []) : [];
      const remoteIds = new Set((data || []).map(order=>String(order.id)));
      legacyOrders = storedOrders.filter(order=>!remoteIds.has(String(order.id)));
    }catch(e){
      console.warn('No se pudieron leer los pedidos guardados anteriormente.', e);
    }
    if(legacyOrders.length && await confirmar(`Se encontraron ${legacyOrders.length} pedidos guardados en este navegador. ¿Importarlos a Supabase?`)){
      const rows = legacyOrders.map((legacyOrder, index)=>{
        const order = {...legacyOrder, cliente:{...(legacyOrder.cliente || {})}};
        order.id = String(order.id || `legacy-${Date.now()}-${index}`);
        order.creado = order.creado || new Date().toISOString();
        order.estatus = ['pendiente','proceso','terminado'].includes(order.estatus) ? order.estatus : 'pendiente';
        order.folio = Number.isInteger(Number(order.folio)) && Number(order.folio)>0 ? Number(order.folio) : undefined;
        normalizarPedido(order);
        return filaDesdePedido(order, order.folio!==undefined);
      });
      const {error:importError} = await supabaseClient.from('pedidos').insert(rows);
      if(importError) throw importError;
      const {error:sequenceError} = await supabaseClient.rpc('sincronizar_folio_pedidos');
      if(sequenceError) throw sequenceError;
      const refreshed = await supabaseClient.from('pedidos')
        .select('id, folio, creado, estatus, estatus_pago, pago_marcado_en, revisado, datos').order('folio', {ascending:false});
      if(refreshed.error) throw refreshed.error;
      data = refreshed.data;
    }
  }

  state.orders = (data || []).map(pedidoDesdeFila);
  state.commonOrders = await cargarPedidosComunes();
  const erroresImagenes = [];
  await Promise.all(state.orders.map(async order=>{
    if(!order.imagenPath) return;
    const {data:imageData, error:imageError} = await supabaseClient.storage
      .from('imagenes-pedidos')
      .createSignedUrl(order.imagenPath, 86400);
    if(imageError){
      console.error(`No se pudo cargar la imagen del pedido ${order.folio}:`, imageError);
      erroresImagenes.push(`Pedido ${order.folio}: ${imageError.message}`);
    }else{
      order.imagenUrl = imageData.signedUrl;
    }
  }));
  render();
  if(erroresImagenes.length) await avisar('No se pudieron cargar algunas imágenes. ' + erroresImagenes.join(' '));
}

async function cargarPedidosComunes(){
  const pageSize = 1000;
  const pedidos = [];
  let pagina = 0;
  while(true){
    const desde = pagina * pageSize;
    const {data, error} = await supabaseClient.from('pedidos_comunes')
      .select('id, cantidad, precio_unitario, monto, producto, atendido_por, creado')
      .order('creado', {ascending:false})
      .range(desde, desde + pageSize - 1);
    if(error) throw error;
    pedidos.push(...(data || []));
    if(!data || data.length < pageSize) return pedidos;
    pagina++;
  }
}

function sugerenciasPedidosComunes(campo){
  const vistos = new Set();
  return state.commonOrders.reduce((sugerencias, pedido)=>{
    const valor = String(pedido[campo] || '').trim();
    const clave = valor.toLocaleLowerCase('es-MX');
    if(valor && !vistos.has(clave)){
      vistos.add(clave);
      sugerencias.push(valor);
    }
    return sugerencias;
  }, []);
}

function pedidoDesdeFila(row){
  return {...row.datos, id:row.id, folio:Number(row.folio), creado:row.creado, estatus:row.estatus,
    estatusPago:row.estatus_pago || 'pendiente', pagoMarcadoEn:row.pago_marcado_en || null,
    revisado:Boolean(row.revisado)};
}

function filaDesdePedido(order, incluirFolio=false){
  const {id, folio, creado, estatus, estatusPago, pagoMarcadoEn, revisado, imagenUrl, facturacion, ...datos} = order;
  const row = {id, creado, estatus, estatus_pago:estatusPago || 'pendiente', datos};
  if(incluirFolio) row.folio = folio;
  return row;
}

async function guardarPedidoEnSupabase(order, esNuevo){
  let resultado;
  if(currentRole==='empleado' && !esNuevo){
    const {data, error} = await supabaseClient.rpc('actualizar_estatus_pedido', {
      p_pedido_id:order.id,
      p_nuevo_estatus:order.estatus,
      p_nuevo_estatus_pago:order.estatusPago,
      p_nueva_imagen_path:order.imagenPath || null
    });
    if(error) throw error;
    return pedidoDesdeFila(data);
  }
  if(currentRole==='empleado' && esNuevo){
    const {error} = await supabaseClient.from('pedidos').insert(filaDesdePedido(order, true));
    if(error) throw error;
    const {data, error:loadError} = await supabaseClient.rpc('pedidos_para_empleado');
    if(loadError) throw loadError;
    const pedidoCreado = (data || []).find(pedido=>String(pedido.id)===String(order.id));
    if(!pedidoCreado) throw new Error('El pedido se guardó, pero no se pudo recuperar su vista de empleado.');
    return pedidoDesdeFila(pedidoCreado);
  }
  if(esNuevo){
    resultado = await supabaseClient.from('pedidos').insert(filaDesdePedido(order, true))
      .select('id, folio, creado, estatus, estatus_pago, pago_marcado_en, revisado, datos').single();
  }else{
    resultado = await supabaseClient.from('pedidos').update(filaDesdePedido(order))
      .eq('id', order.id).select('id, folio, creado, estatus, estatus_pago, pago_marcado_en, revisado, datos').single();
  }
  if(resultado.error) throw resultado.error;
  return pedidoDesdeFila(resultado.data);
}

function calcTotales(order){
  const subtotal = order.productos.reduce((a,p)=>a + (Number(p.cantidad)||0)*(Number(p.precio)||0), 0);
  const iva = order.ivaAplica ? subtotal*0.16 : 0;
  const total = subtotal + iva;
  const saldo = order.estatusPago==='pagado' ? 0 : total - (Number(order.anticipo)||0);
  return {subtotal, iva, total, saldo};
}

  const pedidosActivos = state.orders.filter(o=>!o.revisado);

  const pedidosEnProceso = pedidosActivos.filter(o=>o.estatus==='proceso');
  const pedidosUrgentes = pedidosActivos.filter(o=>o.tipoPedido==='urgente');
  let porCobrar = 0;
  const hoy = fechaLocalISO();
  let ingresosHoy = 0;
  if(currentRole==='admin'){
    pedidosActivos.forEach(o=>{ porCobrar += calcTotales(o).saldo; });
    state.orders.forEach(order=>{
      const creadoHoy = esFechaLocalHoy(order.creado, hoy);
      const pagadoHoy = order.estatusPago==='pagado' && esFechaLocalHoy(order.pagoMarcadoEn, hoy);
      const total = Math.max(0, calcTotales(order).total);
      const anticipo = Math.min(total, Math.max(0, Number(order.anticipo)||0));
      const saldo = total - anticipo;

      if(creadoHoy && order.estatusPago==='pagado'){
        ingresosHoy += total;
      }else{
        if(creadoHoy) ingresosHoy += anticipo;
        if(pagadoHoy) ingresosHoy += saldo;
      }

    state.commonOrders.forEach(order=>{
      if(esFechaLocalHoy(order.creado, hoy)){
        ingresosHoy += Math.max(0, Number(order.monto)||0);
      }
    });
  }
  const entregasHoy = pedidosActivos.filter(o=>o.fechaEntrega===hoy && o.estatus!=='terminado');

  document.getElementById('resumen').innerHTML = `
    <div class="summary-card">
      <div class="num">${pedidosEnDiseno.length}</div>
      <div class="label">Pedidos en diseño</div>

        ? `<div class="summary-order-list">${pedidosEnDiseno.map(order=>`

          `).join('')}</div>`
        : '<div class="summary-order-empty">Sin pedidos en diseño</div>'}
    </div>
    <div class="summary-card">
      <div class="num">${pedidosEnProceso.length}</div>
      <div class="label">Pedidos en proceso</div>
      ${pedidosEnProceso.length
        ? `<div class="summary-order-list">${pedidosEnProceso.map(order=>`
            <button class="summary-order-link" type="button" data-order-id="${escapeHtml(String(order.id))}">${String(order.folio).padStart(4,'0')}</button>
          `).join('')}</div>`
        : '<div class="summary-order-empty">Sin pedidos en proceso</div>'}
    </div>
    <div class="summary-card">
        <div class="num">${pedidosUrgentes.length}</div>
        <div class="label">Pedidos urgentes</div>
        ${pedidosUrgentes.length
          ? `<div class="summary-order-list">${pedidosUrgentes.map(order=>`
              <button class="summary-order-link" type="button" data-order-id="${escapeHtml(String(order.id))}">${String(order.folio).padStart(4,'0')}</button>
            `).join('')}</div>`
          : '<div class="summary-order-empty">Sin pedidos urgentes</div>'}
    </div>
    <div class="summary-card">
      <div class="num">${entregasHoy.length}</div>
      <div class="label">Entregas hoy</div>
      ${entregasHoy.length
        ? `<div class="summary-order-list">${entregasHoy.map(order=>`
            <button class="summary-order-link" type="button" data-order-id="${escapeHtml(String(order.id))}">${String(order.folio).padStart(4,'0')}${currentRole==='admin'?' · '+escapeHtml(order.cliente?.nombre||'Sin nombre'):''}</button>
          `).join('')}</div>`
        : '<div class="summary-order-empty">Sin entregas pendientes</div>'}
    </div>
    ${currentRole==='admin'
      ? `<div class="summary-card"><div class="num">$${fmt(porCobrar)}</div><div class="label">Por cobrar (saldos)</div></div>`
      : ''}
    ${currentRole==='admin'
      ? `<div class="summary-card"><div class="num">$${fmt(ingresosHoy)}</div><div class="label">Ingresos de hoy</div></div>`
      : ''}

}

function fechaLocalISO(fecha=new Date()){
  return [fecha.getFullYear(), String(fecha.getMonth()+1).padStart(2,'0'), String(fecha.getDate()).padStart(2,'0')].join('-');
}

function esFechaLocalHoy(fecha, hoy=fechaLocalISO()){
  if(!fecha) return false;
  const fechaParseada = new Date(fecha);
  return !Number.isNaN(fechaParseada.getTime()) && fechaLocalISO(fechaParseada)===hoy;
}

function programarActualizacionDiaria(){
  const ahora = new Date();
  const siguienteMedianoche = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()+1);
  window.setTimeout(()=>{
    renderResumen();
    programarActualizacionDiaria();
  }, siguienteMedianoche.getTime()-ahora.getTime());
}

function normalizarBusqueda(texto){
  return String(texto||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

function fechaHoyLocal(){
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
}

function esPedidoMasUrgente(o, hoy){
  return o.tipoPedido === 'urgente' && o.fechaEntrega === hoy;
}

function fechaLocalDeISO(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function coincideFiltroFechas(creado){
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  if(!desde && !hasta) return true;
  const fecha = fechaLocalDeISO(creado);
  return Boolean(fecha) && (!desde || fecha>=desde) && (!hasta || fecha<=hasta);
}

function pasaFiltro(o){
  if(!coincideFiltroFechas(o.creado)) return false;
  const busqueda = normalizarBusqueda(document.getElementById('buscarCliente').value);
  const busquedaFolio = busqueda.replace(/^#/, '');
  const folio = String(o.folio ?? '');
  const coincideNombre = normalizarBusqueda(o.cliente?.nombre).includes(busqueda);
  const coincideFolio = busquedaFolio && (
    folio.includes(busquedaFolio) || folio.padStart(4,'0').includes(busquedaFolio)
  );
  if(busqueda && !coincideNombre && !coincideFolio) return false;
  if(currentFilter==='todos') return true;
  if(currentFilter==='urgente') return o.tipoPedido === 'urgente' || o.fechaEntrega === fechaHoyLocal();
  if(currentFilter==='debe') return calcTotales(o).saldo > 0.009;
  if(currentFilter==='pago_en_proceso') return o.estatusPago === 'en_proceso';
  if(currentFilter==='anticipo_recibido') return o.estatusPago === 'anticipo_recibido';
  if(currentFilter==='pagado') return o.estatusPago === 'pagado';
  return o.estatus === currentFilter;
}

function pasaFiltroPedidoComun(pedido){
  if(currentFilter!=='todos' || !coincideFiltroFechas(pedido.creado)) return false;
  const busqueda = normalizarBusqueda(document.getElementById('buscarCliente').value);
  if(!busqueda) return true;
  return [
    pedido.producto,
    pedido.atendido_por,
    String(pedido.cantidad||1),
    String(pedido.precio_unitario||pedido.monto),
    fmt(pedido.precio_unitario||pedido.monto),
    String(pedido.monto),
    fmt(pedido.monto)
  ].some(valor=>normalizarBusqueda(valor).includes(busqueda));
}

let ultimoProgreso = null;
function renderPasosProgreso(o, tipo, pasos, actual){
  const posicion = Math.max(0, pasos.findIndex(paso=>paso.k===actual));
  const bloqueadoTodo = o.revisado || (tipo==='pago' && currentRole==='empleado' && actual==='pagado');
  return pasos.map((paso, i)=>{
    const marcado = i<=posicion;
    const habilitado = !bloqueadoTodo && (i===posicion+1 || (i===posicion && i>0));
    const animar = ultimoProgreso && ultimoProgreso.id===o.id && ultimoProgreso.tipo===tipo && ultimoProgreso.nivel===i;
    return `<label class="progress-step ${tipo}-${paso.k}${marcado?' checked':''}${animar?' animar':''}${habilitado?'':' locked'}">
      <input type="checkbox" ${marcado?'checked':''} ${habilitado?'':'disabled'}
        onchange="cambiarProgresoPedido('${o.id}','${tipo}',${i},this)">${paso.l}
    </label>`;
  }).join('');
}

    <div class="progress-group">
      <div class="progress-title">Estatus del pedido</div>

    </div>
    <div class="progress-group">
      <div class="progress-title">Estatus de pago</div>
      <div class="progress-steps">${renderPasosProgreso(o, 'pago', PROGRESO_PAGO, o.estatusPago || 'pendiente')}</div>
    </div>
  </div>`;
}

async function cambiarProgresoPedido(id, tipo, nivel, checkbox){
  const pedido = state.orders.find(x=>x.id===id);
  if(!pedido) return;
  const pasos = tipo==='pedido' ? PROGRESO_PEDIDO : PROGRESO_PAGO;
  const nuevoValor = pasos[checkbox.checked ? nivel : nivel-1].k;
  const nuevoEstatus = tipo==='pedido' ? nuevoValor : pedido.estatus;
  const nuevoPago = tipo==='pago' ? nuevoValor : (pedido.estatusPago || 'pendiente');
  checkbox.closest('.order-progress').querySelectorAll('input').forEach(input=>{ input.disabled = true; });
  if(checkbox.checked){ checkbox.closest('.progress-step').classList.add('animar'); ultimoProgreso = {id, tipo, nivel}; }
  try{
    const guardado = await guardarPedidoEnSupabase({...pedido, estatus:nuevoEstatus, estatusPago:nuevoPago}, false);
    const indice = state.orders.findIndex(x=>x.id===id);
    if(indice>=0) state.orders[indice] = guardado;
  }catch(error){
    await avisar('No se pudo actualizar el estatus. ' + (error.message || ''));
  }
  render();
  ultimoProgreso = null;
}

async function alternarRevisado(id, checkbox){
  const pedido = state.orders.find(x=>x.id===id);
  if(!pedido) return;
  const valor = checkbox.checked;
  checkbox.disabled = true;
  try{
    if(valor && pedido.imagenPath){
      const {error:deleteError} = await supabaseClient.storage
        .from('imagenes-pedidos')
        .remove([pedido.imagenPath]);
      if(deleteError) throw deleteError;
    }
    const {data, error} = await supabaseClient.rpc('marcar_pedido_revisado', {p_pedido_id:id, p_revisado:valor});
    if(error) throw error;
    pedido.revisado = Boolean(data);
    if(valor){
      pedido.imagenPath = null;
      pedido.imagenUrl = null;
    }
  }catch(error){
    await avisar('No se pudo actualizar la casilla. ' + (error.message || ''));
  }
  renderLista();
}

function formatoTiempo(ms){
  const total = Math.floor(ms/1000);
  const dias = Math.floor(total/86400);
  const h = Math.floor((total%86400)/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  const hms = [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
  return dias>0 ? `${dias}d ${hms}` : hms;
}

function actualizarTemporizadores(){
  const ahora = Date.now();
  document.querySelectorAll('.entrega-timer').forEach(el=>{
    const objetivo = new Date(el.dataset.entrega).getTime();
    if(Number.isNaN(objetivo)){ el.textContent = ''; return; }
    const restante = objetivo - ahora;
    if(restante <= 0){
      el.textContent = '⏱ Vencido';
      el.className = 'entrega-timer vencido';
    }else{
      el.textContent = `⏱ Faltan ${formatoTiempo(restante)}`;
      el.className = 'entrega-timer' + (restante <= 3600000 ? ' critico' : restante < 86400000 ? ' pronto' : '');
    }
  });
}
setInterval(actualizarTemporizadores, 1000);

  if(!o.cliente) o.cliente = {nombre:'', whatsapp:'', correo:''};

  if(o.cliente.correo===undefined) o.cliente.correo = '';

  if(o.cliente.whatsapp===undefined) o.cliente.whatsapp = o.cliente.telefono || '';

function opcionesClientesRegistrados(campo){

    if(valor && valor.trim()) valores.add(valor.trim());

}

function normalizarTelefonoCliente(valor){
  const digitos = valor.replace(/\D/g,'');
  if(digitos.length===10) return '52'+digitos;
  if(digitos.length===13 && digitos.startsWith('521')) return '52'+digitos.slice(3);
  return digitos;
}

function buscarClienteRegistrado(campo, valor){
  const buscar = campo==='nombre' ? valor.trim().toLocaleLowerCase('es-MX') : normalizarTelefonoCliente(valor);
  if(!buscar) return null;

  const coincidencias = state.orders.filter(order=>{
    const cliente = order.cliente || {};
    const dato = campo==='nombre' ? cliente.nombre : cliente.whatsapp;
    if(!dato) return false;
    return campo==='nombre'
      ? dato.trim().toLocaleLowerCase('es-MX')===buscar
      : normalizarTelefonoCliente(dato)===buscar;
  }).sort((a,b)=>Number(b.folio||0)-Number(a.folio||0));

  if(!coincidencias.length) return null;
  const perfil = {cliente:{nombre:'', whatsapp:'', correo:''}};
  const camposCliente = ['nombre', 'whatsapp', 'correo'];
  coincidencias.forEach(order=>{
    const cliente = order.cliente || {};
    camposCliente.forEach(campo=>{
      if(!perfil.cliente[campo] && cliente[campo]) perfil.cliente[campo] = cliente[campo];
    });
  });
  return perfil;
}

function actualizarTotalPedidoComun(){
  const cantidad = Number(document.getElementById('comunCantidad').value);
  const precioUnitario = Number(document.getElementById('comunPrecioUnitario').value);
  const totalInput = document.getElementById('comunTotal');
  const precioCentavos = Math.round(precioUnitario * 100);
  const totalCentavos = cantidad * precioCentavos;
  totalInput.value = Number.isSafeInteger(cantidad) && cantidad>0
    && Number.isFinite(precioUnitario) && precioUnitario>0
    && Math.abs(precioUnitario - precioCentavos / 100)<0.00000001
    && Number.isSafeInteger(totalCentavos) && totalCentavos<=999999999999
    ? (totalCentavos / 100).toFixed(2)
    : '';
}

async function guardarPedidoComun(){
  const cantidadInput = document.getElementById('comunCantidad');
  const productoInput = document.getElementById('comunProducto');
  const precioUnitarioInput = document.getElementById('comunPrecioUnitario');
  const totalInput = document.getElementById('comunTotal');
  const atendidoPorInput = document.getElementById('comunAtendidoPor');
  const cantidad = Number(cantidadInput.value);
  const producto = productoInput.value.trim();
  const precioUnitario = Number(precioUnitarioInput.value);
  const monto = Number(totalInput.value);
  const atendidoPor = atendidoPorInput.value.trim();
  const precioCentavos = Math.round(precioUnitario * 100);
  const totalCalculado = cantidad * precioCentavos / 100;
  if(!Number.isSafeInteger(cantidad) || cantidad<=0 || cantidad>2147483647){
    await avisar('Indica una cantidad entera mayor que cero.');
    cantidadInput.focus();
    return;
  }
  if(!producto){
    await avisar('Indica el producto.');
    productoInput.focus();
    return;
  }
  if(!Number.isFinite(precioUnitario) || precioUnitario<=0 || precioUnitario>9999999999.99
    || Math.abs(precioUnitario - precioCentavos / 100)>=0.00000001
    || !Number.isSafeInteger(cantidad * precioCentavos) || monto!==totalCalculado
    || !Number.isFinite(monto) || monto<=0 || monto>9999999999.99){
    await avisar('Indica un precio unitario mayor que cero y verifica que el total no exceda el máximo permitido.');
    precioUnitarioInput.focus();
    return;
  }
  if(!atendidoPor){
    await avisar('Indica quién atendió.');
    atendidoPorInput.focus();
    return;
  }

  const boton = document.getElementById('btnGuardarPedidoComun');
  boton.disabled = true;
  try{
    const {data, error} = await supabaseClient.from('pedidos_comunes')
      .insert({cantidad, precio_unitario:precioUnitario, monto, producto, atendido_por:atendidoPor})
      .select('id, cantidad, precio_unitario, monto, producto, atendido_por, creado')
      .single();
    if(error) throw error;
    state.commonOrders.unshift(data);
    renderLista();
    closeDrawer();
    toast('Producto común guardado ✓');
  }catch(error){
    boton.disabled = false;
    console.error('No se pudo guardar el producto común:', error);
    await avisar('No se pudo guardar el producto común. Detalle: ' + (error.message || error));
  }
}

    .map(id=>document.getElementById(id))
    .filter(Boolean);
  inputsImagen.forEach(inputImagen=>{
    inputImagen.addEventListener('change', async ()=>{
      const archivo = inputImagen.files[0];
      if(!archivo) return;
      if(draftOrder.revisado){
        inputImagen.value = '';
        await avisar('No se pueden agregar imágenes a un pedido marcado como revisado.');
        return;
      }
      if(!['image/jpeg','image/png','image/webp','image/gif'].includes(archivo.type)){
        inputImagen.value = '';
        await avisar('Selecciona una imagen JPG, PNG, WebP o GIF.');
        return;
      }
      if(archivo.size > 10 * 1024 * 1024){
        inputImagen.value = '';
        await avisar('La imagen no puede superar los 10 MB.');
        return;
      }
      if(imagenPreviewUrl) URL.revokeObjectURL(imagenPreviewUrl);
      imagenPedidoSeleccionada = archivo;
      imagenPreviewUrl = URL.createObjectURL(archivo);
      document.getElementById('imagenPedidoPreview').innerHTML =
        `<img class="order-image-preview" src="${imagenPreviewUrl}" alt="Vista previa de la imagen del pedido">`;
    });
  });
  if(!restringido){
    document.getElementById('btnJPG').addEventListener('click', ()=>generarNota('jpg'));
    document.getElementById('btnPDF').addEventListener('click', ()=>generarNota('pdf'));
    document.getElementById('btnWA').addEventListener('click', abrirWhatsapp);
    document.getElementById('f_nombre').addEventListener('change', ()=>autocompletarDatosCliente('nombre'));
    document.getElementById('f_wa').addEventListener('change', ()=>autocompletarDatosCliente('whatsapp'));
    document.getElementById('f_iva').addEventListener('change', e=>{draftOrder.ivaAplica=e.target.checked; renderTotales();});
    document.getElementById('f_anticipo').addEventListener('input', e=>{draftOrder.anticipo=e.target.value; renderTotales();});
  }

  const btnEl = document.getElementById('btnEliminar');
  if(btnEl){
    btnEl.addEventListener('click', async ()=>{
      const ok = await confirmar('¿Eliminar este pedido? No se puede deshacer.');
      if(ok){
        try{
          const imagenPath = draftOrder.imagenPath;
          const {error} = await supabaseClient.from('pedidos').delete().eq('id', editingId);
          if(error) throw error;
          state.orders = state.orders.filter(x=>x.id!==editingId);
          render(); closeDrawer();
          if(imagenPath){
            const {error:imageError} = await supabaseClient.storage.from('imagenes-pedidos').remove([imagenPath]);
            if(imageError){
              console.error('No se pudo eliminar la imagen del pedido eliminado:', imageError);
              await avisar('El pedido se eliminó, pero no se pudo borrar su imagen de Storage. ' + imageError.message);
              return;
            }
          }
          toast('Pedido eliminado');
        }catch(e){
          await avisar('No se pudo eliminar el pedido. Detalle: ' + (e && e.message ? e.message : e));
        }
      }
    });
  }
}

function toast(msg){
  let t = document.getElementById('toastMsg');
  if(!t){
    t = document.createElement('div');
    t.id='toastMsg';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 2200);
}

async function guardarDesdeForm(){
  try{
    const esEmpleado = currentRole==='empleado';
    const esNuevo = !editingId;
    if(!esEmpleado || esNuevo) leerFormAlDraft();
    if((!esEmpleado || esNuevo) && !draftOrder.cliente.nombre){
      await avisar('Falta el nombre del cliente.');
      return;
    }
    if((!esEmpleado || esNuevo) && !draftOrder.atendidoPor){
      await avisar('Indica quién atendió el pedido ("Atendido por").');
      return;
    }
    if(esEmpleado && esNuevo && !ATENDIDO_POR_OPCIONES.includes(draftOrder.atendidoPor)){
      await avisar('Selecciona una opción válida en "Atendido por".');
      return;
    }
    if(draftOrder.revisado && imagenPedidoSeleccionada){
      await avisar('No se pueden agregar imágenes a un pedido marcado como revisado.');
      return;
    }
    const imagenAnterior = esNuevo ? null : state.orders.find(x=>x.id===draftOrder.id)?.imagenPath;
    let imagenNuevaSubida = null;
    if(imagenPedidoSeleccionada){
      const extensiones = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
      const aleatorio = window.crypto.getRandomValues(new Uint32Array(1))[0].toString(16);
      imagenNuevaSubida = `${draftOrder.id}/${Date.now()}-${aleatorio}.${extensiones[imagenPedidoSeleccionada.type]}`;
      const {error:uploadError} = await supabaseClient.storage
        .from('imagenes-pedidos')
        .upload(imagenNuevaSubida, imagenPedidoSeleccionada, {
          contentType:imagenPedidoSeleccionada.type,
          cacheControl:'3600',
          upsert:false
        });
      if(uploadError) throw uploadError;
      draftOrder.imagenPath = imagenNuevaSubida;
    }

    let pedidoGuardado;
    try{
      pedidoGuardado = await guardarPedidoEnSupabase(draftOrder, esNuevo);
    }catch(error){
      if(imagenNuevaSubida){
        const {error:cleanupError} = await supabaseClient.storage.from('imagenes-pedidos').remove([imagenNuevaSubida]);
        if(cleanupError){
          console.error('No se pudo limpiar la imagen después de fallar el guardado:', cleanupError);
          throw new Error(`${error.message || error} No se pudo limpiar el archivo subido: ${cleanupError.message}`);
        }
      }
      throw error;
    }
    let avisoImagen = '';
    if(pedidoGuardado.imagenPath){
      const {data:imageData, error:imageUrlError} = await supabaseClient.storage
        .from('imagenes-pedidos')
        .createSignedUrl(pedidoGuardado.imagenPath, 86400);
      if(imageUrlError){
        console.error('El pedido se guardó, pero no se pudo generar el enlace de su imagen:', imageUrlError);
        avisoImagen = ` No se pudo mostrar su imagen: ${imageUrlError.message}`;
      }else{
        pedidoGuardado.imagenUrl = imageData.signedUrl;
      }
    }
    const idx = state.orders.findIndex(x=>x.id===pedidoGuardado.id);
    if(idx===-1) state.orders.push(pedidoGuardado);
    else state.orders[idx] = pedidoGuardado;
    let errorImagenAnterior = '';
    if(imagenAnterior && imagenAnterior!==pedidoGuardado.imagenPath){
      const {error:deleteError} = await supabaseClient.storage.from('imagenes-pedidos').remove([imagenAnterior]);
      if(deleteError){
        console.error('No se pudo eliminar la imagen anterior del pedido:', deleteError);
        errorImagenAnterior = ` No se pudo eliminar la imagen anterior: ${deleteError.message}`;
      }
    }
    limpiarSeleccionImagen();
    editingId = pedidoGuardado.id;
    render();
    closeDrawer();
    if(errorImagenAnterior || avisoImagen) await avisar('El pedido se guardó.' + avisoImagen + errorImagenAnterior);
    else toast('Pedido guardado ✓');
  }catch(e){
    console.error('Error al guardar pedido:', e);
    await avisar('No se pudo guardar el pedido. Detalle: ' + (e && e.message ? e.message : e));
  }
}

async function generarNota(tipo){
  leerFormAlDraft();
  if(currentRole==='admin' && !draftOrder.atendidoPor){
    await avisar('Indica quién atendió el pedido ("Atendido por").');
    return;
  }
  const cont = document.getElementById('nota-render');
  cont.innerHTML = construirNotaHTML(draftOrder);
  const posicionOriginal = {left:cont.style.left, top:cont.style.top, visibility:cont.style.visibility};
  cont.style.left = '0px';
  cont.style.top = '0px';
  cont.style.visibility = 'hidden';

  let canvas;
  try{
    const imagenesRedes = Array.from(cont.querySelectorAll('img.nota-redes-icon'));
    await Promise.all(imagenesRedes.map(imagen=>imagen.decode()));
    canvas = await html2canvas(cont, {
      scale:2,
      backgroundColor:'#ffffff',
      windowWidth:window.innerWidth,
      windowHeight:Math.max(window.innerHeight, cont.scrollHeight),
      scrollX:0,
      scrollY:0,
      onclone:clonedDocument=>{
        const notaClonada = clonedDocument.getElementById('nota-render');
        if(notaClonada) notaClonada.style.visibility = 'visible';
      }
    });
  }finally{
    cont.style.left = posicionOriginal.left;
    cont.style.top = posicionOriginal.top;
    cont.style.visibility = posicionOriginal.visibility;
  }

  const folioStr = String(draftOrder.folio).padStart(4,'0');
  if(tipo==='jpg'){
    const link = document.createElement('a');
    link.download = `pedido-${folioStr}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  } else {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    const pageWidth = 210;
    const pageHeight = 297;
    const pageMargin = 10;
    const printableWidth = pageWidth - pageMargin * 2;
    const printableHeight = pageHeight - pageMargin * 2;
    const pixelsPerMm = canvas.width / printableWidth;
    const maxPagePixels = Math.floor(printableHeight * pixelsPerMm);
    const notaBounds = cont.getBoundingClientRect();
    const escalaCanvas = canvas.width / notaBounds.width;
    const cortesSeguros = Array.from(cont.querySelectorAll(
      '.nota-head, .nota-cliente, .nota-tabla thead, .nota-tabla tbody tr, .nota-totales, .nota-foot, .nota-redes, .nota-horario, .nota-consulta'
    )).map(elemento=>Math.round((elemento.getBoundingClientRect().bottom - notaBounds.top) * escalaCanvas))
      .filter(corte=>corte>0 && corte<=canvas.height)
      .sort((a,b)=>a-b);
    const encabezadoTabla = cont.querySelector('.nota-tabla thead');
    const altoEncabezado = encabezadoTabla
      ? Math.ceil(encabezadoTabla.getBoundingClientRect().height * escalaCanvas)
      : 0;
    const inicioEncabezado = encabezadoTabla
      ? Math.round((encabezadoTabla.getBoundingClientRect().top - notaBounds.top) * escalaCanvas)
      : 0;

    const enlaces = Array.from(cont.querySelectorAll('.nota-link')).flatMap(el=>
      Array.from(el.getClientRects()).map(r=>({
        x:(r.left - notaBounds.left) * escalaCanvas,
        w:r.width * escalaCanvas,
        top:(r.top - notaBounds.top) * escalaCanvas,
        bottom:(r.bottom - notaBounds.top) * escalaCanvas
      })));

    let inicio = 0;
    let numeroPagina = 0;
    while(inicio < canvas.height){
      const repetirEncabezado = numeroPagina > 0 && altoEncabezado > 0;
      const altoDisponible = maxPagePixels - (repetirEncabezado ? altoEncabezado : 0);
      const limite = Math.min(canvas.height, inicio + altoDisponible);
      const cortesPagina = cortesSeguros.filter(corte=>corte>inicio && corte<=limite);
      const fin = limite===canvas.height ? canvas.height : (cortesPagina.pop() || limite);
      const altoContenido = fin - inicio;
      const altoPagina = altoContenido + (repetirEncabezado ? altoEncabezado : 0);
      const paginaCanvas = document.createElement('canvas');
      paginaCanvas.width = canvas.width;
      paginaCanvas.height = altoPagina;
      const contexto = paginaCanvas.getContext('2d');

      if(repetirEncabezado){
        contexto.drawImage(canvas, 0, inicioEncabezado, canvas.width, altoEncabezado, 0, 0, canvas.width, altoEncabezado);
      }
      contexto.drawImage(canvas, 0, inicio, canvas.width, altoContenido, 0,
        repetirEncabezado ? altoEncabezado : 0, canvas.width, altoContenido);

      if(numeroPagina > 0) pdf.addPage();
      const altoEnMm = altoPagina / pixelsPerMm;
      pdf.addImage(paginaCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', pageMargin, pageMargin, printableWidth, altoEnMm);
      const desplazamiento = repetirEncabezado ? altoEncabezado : 0;
      enlaces.filter(e=>e.top>=inicio && e.bottom<=fin).forEach(e=>{
        pdf.link(
          pageMargin + e.x / pixelsPerMm,
          pageMargin + (e.top - inicio + desplazamiento) / pixelsPerMm,
          e.w / pixelsPerMm,
          (e.bottom - e.top) / pixelsPerMm,
          {url:'https://yaviste.vercel.app/'}
        );
      });
      inicio = fin;
      numeroPagina++;
    }
    pdf.save(`pedido-${folioStr}.pdf`);
  }
}

    productos: draftOrder.productos,
    ivaAplica: draftOrder.ivaAplica
  }));
  window.location.href = 'Cotizaciones.html';
}

function iniciarCotizacion(){
  if(document.getElementById('drawer').classList.contains('show') && draftOrder && !pedidoEmpleadoRestringido(draftOrder)){
    irACotizacion();
    return;
  }
  sessionStorage.removeItem('yaviste-cotizacion-borrador');
  window.location.href = 'Cotizaciones.html';
}

function abrirWhatsapp(){
  leerFormAlDraft();
  const numero = (draftOrder.cliente.whatsapp || '').replace(/\D/g,'');
  if(!numero){
    avisar('Agrega un número de WhatsApp o teléfono del cliente primero.');
    return;
  }
  const t = calcTotales(draftOrder);
  const folioStr = String(draftOrder.folio).padStart(4,'0');
  const msg = `Hola ${draftOrder.cliente.nombre||''}, te compartimos tu pedido #${folioStr} de Ya Viste.\\nTotal: $${fmt(t.total)}\\nAnticipo: $${fmt(draftOrder.anticipo)}\\n${t.saldo>0.009 ? 'Saldo pendiente: $'+fmt(t.saldo) : 'Pedido liquidado'}\\nFecha de entrega: ${draftOrder.fechaEntrega||'por confirmar'}\\n\\nEn un momento te enviamos tu nota en imagen o PDF. ¡Gracias por tu preferencia!`;
  const url = `https://wa.me/52${numero}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  avisar('Se abrió WhatsApp con el mensaje listo. Descarga la nota (JPG o PDF) y adjúntala manualmente en el chat, ya que WhatsApp no permite adjuntar archivos automáticamente desde un enlace.');
}

function exportarExcel(){
  if(state.orders.length===0){
    avisar('Todavía no hay pedidos guardados para exportar.');
    return;
  }
  const pedidosRows = [];
  const detalleRows = [];

  [...state.orders].sort((a,b)=>a.folio-b.folio).forEach(o=>{
    const t = calcTotales(o);
    pedidosRows.push({
      'Folio': String(o.folio).padStart(4,'0'),
      'Fecha creado': new Date(o.creado).toLocaleDateString('es-MX'),
      'Cliente': o.cliente.nombre,
      'WhatsApp': o.cliente.whatsapp,
      'Correo': o.cliente.correo,
      'Fecha de entrega': o.fechaEntrega,
      'Domicilio de entrega': o.domicilioEntrega||'',
      'Método de pago': o.metodoPago||'',
      'Estatus': {pendiente:'En diseño', proceso:'En proceso', terminado:'Terminado'}[o.estatus],
      'Subtotal': Number(t.subtotal.toFixed(2)),
      'IVA': Number(t.iva.toFixed(2)),
      'Total': Number(t.total.toFixed(2)),
      'Anticipo': Number((Number(o.anticipo)||0).toFixed(2)),
      'Saldo pendiente': Number(t.saldo.toFixed(2)),
      'Notas': o.notas
    });
    o.productos.forEach(p=>{
      detalleRows.push({
        'Folio': String(o.folio).padStart(4,'0'),
        'Cliente': o.cliente.nombre,
        'Descripción': p.desc,
        'Cantidad': Number(p.cantidad)||0,
        'Precio unitario': Number(p.precio)||0,
        'Importe': Number(((Number(p.cantidad)||0)*(Number(p.precio)||0)).toFixed(2))
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const wsPedidos = XLSX.utils.json_to_sheet(pedidosRows);
  const wsDetalle = XLSX.utils.json_to_sheet(detalleRows);
  XLSX.utils.book_append_sheet(wb, wsPedidos, 'Pedidos');
  XLSX.utils.book_append_sheet(wb, wsDetalle, 'Detalle productos');

  const hoy = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `pedidos-ya-viste-${hoy}.xlsx`);
}

document.getElementById('btnExportar').addEventListener('click', exportarExcel);
</script>
